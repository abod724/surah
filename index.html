<style>
  * { box-sizing: border-box; }
  body { 
    font-family: 'Cairo', sans-serif; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    margin: 0;
    scroll-behavior: smooth;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .header-title { color: #fff; text-align: center; margin-bottom: 14px; }
  .header-title .logo {
    width: 45px;
    height: 45px;
    margin: 0 auto 6px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    display: block;
  }
  .header-title h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
  .header-title p { font-size: 13px; opacity: 0.9; margin: 0; }
  canvas { 
    max-width: 100%; 
    height: auto;
    border-radius: 14px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: block;
    margin: 0 auto;
  }
  input[type="color"] { 
    height: 48px; width: 100%;
    border-radius: 12px; cursor: pointer;
    border: 2px solid #e5e7eb; padding: 2px;
  }
  input[type="text"], textarea, select {
    width: 100%; padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    transition: border 0.2s;
    background: #fafafa;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none; border-color: #667eea; background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  label {
    display: block; font-weight: 700;
    color: #374151; margin-bottom: 8px; font-size: 14px;
  }
  .field { margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .templates { display: flex; flex-wrap: wrap; gap: 8px; }
  .template-btn {
    padding: 10px 16px; border-radius: 10px;
    border: 2px solid #e5e7eb; background: #fff;
    cursor: pointer; font-family: 'Cairo', sans-serif;
    font-weight: 700; font-size: 13px; color: #6b7280;
    transition: all 0.2s;
  }
  .template-btn.active {
    border-color: #667eea; background: #eef2ff; color: #4338ca;
  }
  .template-btn:active { transform: scale(0.95); }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .palette-color {
    aspect-ratio: 1; border-radius: 8px;
    cursor: pointer; border: 3px solid transparent;
    transition: transform 0.2s;
  }
  .palette-color:hover { transform: scale(1.1); }
  .palette-color.active { border-color: #111; }
  .file-input {
    width: 100%; padding: 10px;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background: #f8fafc;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
  }
  .btn {
    padding: 14px 20px; border-radius: 12px; border: none;
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: 15px; cursor: pointer; transition: all 0.2s;
    color: white;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; flex: 1; }
  .btn-primary:hover { background: #5568d3; }
  .btn-green { background: #10b981; flex: 1; }
  .btn-green:hover { background: #059669; }
  .btn-purple { background: #8b5cf6; padding: 14px 20px; }
  .btn-purple:hover { background: #7c3aed; }
  .btn-small {
    margin-top: 8px; padding: 8px 14px;
    border-radius: 8px; border: none;
    background: #ef4444; color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .status-box {
    margin-top: 8px; padding: 10px;
    border-radius: 10px;
    background: #f1f5f9;
    font-size: 13px; color: #475569;
    text-align: center; font-weight: 700;
  }
  .footer {
    text-align: center; color: #fff;
    font-size: 13px; padding: 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 14px; margin-top: 16px;
    font-weight: 700;
  }
  .footer small {
    display: block; margin-top: 4px;
    opacity: 0.85; font-weight: 400;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 12px;
    background: #f8fafc;
    border-radius: 12px;
    border: 2px solid #e5e7eb;
    font-weight: 700;
    color: #374151;
    margin-bottom: 0;
  }
  .checkbox-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
  }
  .hint {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 400;
    margin-top: 4px;
    display: block;
  }
  @media (max-width: 480px) {
    .header-title h1 { font-size: 20px; }
    .header-title .logo { width: 40px; height: 40px; }
    .grid-2 { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    .palette { grid-template-columns: repeat(6, 1fr); }
  }

  #nibras-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    height: 56px;
    padding: 0 22px 0 18px;
    border-radius: 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(102,126,234,0.5);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s;
    animation: nibras-pulse 2.5s infinite;
  }
  #nibras-bubble .spark {
    font-size: 20px;
    animation: nibras-spark 2s infinite;
    display: inline-block;
  }
  #nibras-bubble:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 32px rgba(102,126,234,0.7);
  }
  #nibras-bubble:active { transform: scale(0.97); }

  @keyframes nibras-pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(102,126,234,0.5); }
    50% { box-shadow: 0 8px 32px rgba(102,126,234,0.85), 0 0 0 12px rgba(102,126,234,0.12); }
  }
  @keyframes nibras-spark {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.15); }
  }

  #nibras-chat {
    position: fixed;
    bottom: 95px;
    right: 24px;
    width: 380px;
    height: 540px;
    border: none;
    border-radius: 18px;
    box-shadow: 0 16px 50px rgba(0,0,0,0.3);
    display: none;
    z-index: 9998;
    background: white;
    overflow: hidden;
  }
  #nibras-chat.active {
    display: block;
    animation: nibras-slide 0.35s ease-out;
  }
  @keyframes nibras-slide {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #nibras-close {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #nibras-close:hover { background: rgba(0,0,0,0.85); }

  #nibras-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    color: #64748b;
    font-size: 14px;
    font-weight: 700;
    flex-direction: column;
    gap: 12px;
  }
  .nibras-spin {
    width: 40px;
    height: 40px;
    border: 4px solid #e2e8f0;
    border-top-color: #667eea;
    border-radius: 50%;
    animation: nibras-spin 0.8s linear infinite;
  }
  @keyframes nibras-spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    #nibras-bubble {
      height: 50px;
      padding: 0 16px 0 14px;
      font-size: 14px;
      bottom: 16px;
      right: 16px;
      gap: 8px;
    }
    #nibras-bubble .spark { font-size: 18px; }
    #nibras-chat {
      width: calc(100vw - 32px);
      height: 75vh;
      bottom: 80px;
      right: 16px;
      border-radius: 14px;
    }
  }
</style>

<body>

<div class="container">

  <!-- العنوان -->

  <!-- الأدوات -->
  <div class="card">

    <div class="field">
      <label>✍️ النص</label>
      <textarea id="textInput" rows="6" placeholder="اكتب نصك هنا...">اترك أثراً جميلاً أينما ذهبت</textarea>

    <div class="field">

      <div class="templates" id="templates">
        <button class="template-btn active" data-tpl="quote">اقتباس</button>

      <label>🌈 ألوان جاهزة</label>

    </div>

        <label>🎨 الخلفية</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="field">
        <label>✏️ لون النص</label>
        <input type="color" id="textColor" value="#000000">
      </div>
    </div>

    <div class="field">
      <label>📝 الخط</label>
      <select id="fontSelect">
        <option value="Cairo">Cairo — حديث</option>
        <option value="Amiri">Amiri — كلاسيكي</option>
        <option value="Tajawal">Tajawal — أنيق</option>
        <option value="Rubik">Rubik — عصري</option>
      </select>
    </div>

    <div class="field">
      <label>📐 القياس</label>
      <select id="sizeSelect">
        <option value="1080x1080">مربع (Post)</option>
        <option value="1080x1920">طويل (Story)</option>
        <option value="1200x675">عريض (Twitter)</option>
        <option value="1080x1350">عمودي (Instagram)</option>

    <div class="field">
      <label>🏷️ التوقيع (اختياري)</label>
      <input type="text" id="signature" value="@username" placeholder="@حسابك">
    </div>

    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="showCopyright" checked onchange="draw()">
        <span>إظهار حقوق نبراس GP في الصورة</span>
      </label>

    <div class="field">
      <label>🖼️ صورة خلفية (اختياري)</label>

    </div>

    <div class="field">
      <label>💾 تصدير الصورة</label>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="downloadImage()">💾 تحميل PNG</button>
        <button class="btn btn-green" onclick="copyToClipboard()">📋 نسخ</button>
        <button class="btn btn-purple" onclick="randomize()">🎲</button>
      </div>
    </div>

    <div class="field">
      <label>🎬 تصدير فيديو</label>
      
      <label style="font-size:13px;color:#6b7280;margin-top:8px;">نوع الحركة</label>
      <select id="animationType" style="margin-bottom:12px;">
        <option value="fade">✨ تلاشي (Fade)</option>
        <option value="pulse">💫 وميض (Pulse)</option>
        <option value="typewriter">⌨️ كتابة حرف بحرف</option>

        <option value="zoom">🔍 تكبير تدريجي</option>

      <label style="font-size:13px;color:#6b7280;">الصوت (اختياري)</label>
      <input type="file" id="audioUpload" accept="audio/*" class="file-input" style="margin-bottom:8px;">
      <button class="btn-small" onclick="clearAudio()">🗑️ حذف الصوت</button>

      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-primary" onclick="exportVideo(3)">🎬 3 ثواني</button>
        <button class="btn btn-primary" onclick="exportVideo(5)">🎬 5 ثواني</button>
        <button class="btn btn-primary" onclick="exportVideo(10)">🎬 10 ثواني</button>

      <div id="videoStatus" class="status-box" style="display:none;"></div>

  </div>

  <div class="footer">
    جميع الحقوق محفوظة © نبراس GP 2026
    <small>🖌️ ريشة — استوديو الصور والفيديوهات</small>
  </div>

</div>

<button id="nibras-bubble" onclick="toggleNibras()" title="اسأل نبراس">
  <span class="spark">✨</span>
  <span>اسأل نبراس</span>
</button>

<div id="nibras-chat">
  <button id="nibras-close" onclick="toggleNibras()">✕</button>
  <div id="nibras-loader">
    <div class="nibras-spin"></div>
    <span>جاري تحميل نبراس...</span>
  </div>
  <iframe 
    id="nibras-iframe"
    src=""
    style="width:100%;height:100%;border:none;position:relative;z-index:1;"
    allow="microphone; clipboard-write;"
  ></iframe>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let currentTemplate = 'quote';
let bgImage = null;

let audioFile = null;
let audioURL = null;
let audioElement = null;

['textInput','bgColor','textColor','fontSelect','sizeSelect','signature'].forEach(id => {
  document.getElementById(id).addEventListener('input', draw);
});

document.getElementById('showCopyright').addEventListener('change', draw);

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTemplate = btn.dataset.tpl;
    draw();
  });
});

const PALETTE = [
  '#1e40af','#7c3aed','#db2777','#dc2626',
  '#ea580c','#f59e0b','#16a34a','#0891b2',
  '#0f172a','#334155','#78350f','#064e3b',
  '#831843','#1e1b4b','#14532d','#7f1d1d'
];

function buildPalette() {
  const wrap = document.getElementById('palette');
  PALETTE.forEach(c => {
    const div = document.createElement('div');
    div.className = 'palette-color';
    div.style.background = c;
    div.onclick = () => {
      document.getElementById('bgColor').value = c;
      document.querySelectorAll('.palette-color').forEach(p => p.classList.remove('active'));
      div.classList.add('active');
      draw();
    };
    wrap.appendChild(div);
  });
}
buildPalette();

document.getElementById('imageUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { 
      bgImage = img; 
      draw();
      scrollToPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function clearImage() {
  bgImage = null;
  document.getElementById('imageUpload').value = '';
  draw();
}

document.getElementById('audioUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  audioFile = file;
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(file);
  audioElement = new Audio(audioURL);
  
  const info = document.getElementById('audioInfo');
  info.style.display = 'block';
  info.textContent = '🎵 تم رفع: ' + file.name;
});

function clearAudio() {
  audioFile = null;
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = null;
  audioElement = null;
  document.getElementById('audioUpload').value = '';
  document.getElementById('audioInfo').style.display = 'none';
}

function scrollToPreview() {
  const canvasEl = document.getElementById('canvas');
  const rect = canvasEl.getBoundingClientRect();
  if (rect.top < 0 || rect.bottom > window.innerHeight) {
    canvasEl.scrollIntoView({ 
      behavior: 'smooth', 
      block: 'center' 
    });
  }
}

// ═══════════════════════════════════════
// wrapText — يحترم الأسطر الفارغة
// ═══════════════════════════════════════
function wrapText(ctx, text, maxWidth) {
  // اقسم النص حسب الأسطر (\n)
  const paragraphs = text.split('\n');
  const lines = [];
  
  paragraphs.forEach(paragraph => {
    // إذا السطر فارغ — احفظه كما هو
    if (paragraph.trim() === '') {
      lines.push('');
      return;
    }
    
    // السطر العادي — اكسره لو طويل
    const words = paragraph.split(/\s+/);
    let current = '';
    
    words.forEach(word => {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    
    if (current) lines.push(current);
  });
  
  return lines;
}

function draw() {
  const [w, h] = document.getElementById('sizeSelect').value.split('x').map(Number);
  canvas.width = w;
  canvas.height = h;

  const text = document.getElementById('textInput').value || ' ';
  const bg = document.getElementById('bgColor').value;
  const fg = document.getElementById('textColor').value;
  const font = document.getElementById('fontSelect').value;
  const sig = document.getElementById('signature').value;
  const showCopy = document.getElementById('showCopyright').checked;

  drawBackground(w, h, bg, fg);

  const fontSize = w / 16;
  ctx.fillStyle = fg;
  ctx.font = `bold ${fontSize}px "${font}", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'rtl';

  const lines = wrapText(ctx, text, w * 0.85);
  const lineHeight = fontSize * 1.3;
  const totalHeight = lines.length * lineHeight;
  const startY = (h - totalHeight) / 2 + lineHeight / 2;

  lines.forEach((line, i) => {
    // لا تطبع الأسطر الفارغة (تبقى فارغة)
    if (line.trim() === '') return;
    ctx.fillText(line, w / 2, startY + i * lineHeight);
  });

  if (sig.trim()) {
    const sigSize = w / 28;
    ctx.font = `600 ${sigSize}px "${font}", sans-serif`;
    ctx.globalAlpha = 0.85;
    ctx.fillText(sig, w / 2, h - sigSize * 2.5);
    ctx.globalAlpha = 1;
  }

  if (showCopy) {
    const copySize = w / 55;
    ctx.font = `600 ${copySize}px "Cairo", sans-serif`;
    ctx.globalAlpha = 0.55;
    ctx.fillText('© نبراس GP', w / 2, h - copySize * 1.5);
    ctx.globalAlpha = 1;
  }
}

function drawBackground(w, h, bg, fg) {
  if (bgImage) {
    ctx.drawImage(bgImage, 0, 0, w, h);
  } else if (currentTemplate === 'gradient') {
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, bg);
    grad.addColorStop(1, shadeColor(bg, 50));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  } else if (currentTemplate === 'frame') {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = fg;
    ctx.lineWidth = 10;
    ctx.strokeRect(50, 50, w - 100, h - 100);
  } else {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
  }
}

function animFade(progress) {
  const opacity = 1 - Math.pow(1 - progress, 3);
  return { opacity: opacity, offsetX: 0, offsetY: 0, scale: 1, textVisible: 1 };
}

function animPulse(progress) {
  const opacity = progress < 0.5 ? progress * 2 : 1;
  const scale = 1 + Math.sin(progress * Math.PI * 2) * 0.08;
  return { opacity: 1, offsetX: 0, offsetY: 0, scale: scale, textVisible: opacity };
}

function animTypewriter(progress, fullText) {
  const chars = Math.floor(progress * fullText.length);
  return { 
    opacity: 1, offsetX: 0, offsetY: 0, scale: 1, 
    textVisible: 1,
    visibleText: fullText.substring(0, chars)
  };
}

function animSlide(progress) {
  const eased = 1 - Math.pow(1 - progress, 3);
  return { 
    opacity: eased, 
    offsetX: (1 - eased) * 300,
    offsetY: 0, 
    scale: 1, 
    textVisible: 1 
  };
}

function animZoom(progress) {
  const eased = 1 - Math.pow(1 - progress, 3);
  return { 
    opacity: eased, 
    offsetX: 0, 
    offsetY: 0, 
    scale: 0.4 + eased * 0.6,
    textVisible: 1 
  };
}

function drawWithAnimation(anim) {
  const w = canvas.width;
  const h = canvas.height;

  let text = document.getElementById('textInput').value || ' ';
  if (anim.visibleText !== undefined) {
    text = anim.visibleText || ' ';
  }
  
  const bg = document.getElementById('bgColor').value;
  const fg = document.getElementById('textColor').value;
  const font = document.getElementById('fontSelect').value;
  const sig = document.getElementById('signature').value;
  const showCopy = document.getElementById('showCopyright').checked;

  ctx.clearRect(0, 0, w, h);
  drawBackground(w, h, bg, fg);

  ctx.save();
  ctx.globalAlpha = anim.opacity * anim.textVisible;
  ctx.fillStyle = fg;
  
  const fontSize = w / 16;
  ctx.font = `bold ${fontSize}px "${font}", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.direction = 'rtl';

  const lines = wrapText(ctx, text, w * 0.85);
  const lineHeight = fontSize * 1.3;
  const totalHeight = lines.length * lineHeight;
  const startY = (h - totalHeight) / 2 + lineHeight / 2;

  if (anim.scale !== 1 || anim.offsetX !== 0 || anim.offsetY !== 0) {
    ctx.translate(w / 2 + anim.offsetX, h / 2 + anim.offsetY);
    ctx.scale(anim.scale, anim.scale);
    ctx.translate(-w / 2, -h / 2);
  }

  lines.forEach((line, i) => {
    if (line.trim() === '') return;
    ctx.fillText(line, w / 2, startY + i * lineHeight);
  });

  if (sig.trim()) {
    const sigSize = w / 28;
    ctx.font = `600 ${sigSize}px "${font}", sans-serif`;
    ctx.globalAlpha = anim.opacity * 0.85;
    ctx.fillText(sig, w / 2, h - sigSize * 2.5);
  }

  if (showCopy) {
    const copySize = w / 55;
    ctx.font = `600 ${copySize}px "Cairo", sans-serif`;
    ctx.globalAlpha = anim.opacity * 0.55;
    ctx.fillText('© نبراس GP', w / 2, h - copySize * 1.5);
  }
  ctx.restore();
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + percent));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + percent));
  const b = Math.min(255, Math.max(0, (num & 0xff) + percent));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function downloadImage() {

function randomize() {

  const fonts = ['Cairo','Amiri','Tajawal','Rubik'];

  tplBtn.classList.add('active');

}

async function exportVideo(seconds) {
  const status = document.getElementById('videoStatus');
  status.style.display = 'block';
  status.textContent = '🎬 جاري التحضير...';
  
  scrollToPreview();
  
  try {
    if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
      throw new Error('غير مدعوم');
    }
    
    const [w, h] = document.getElementById('sizeSelect').value.split('x').map(Number);
    canvas.width = w;
    canvas.height = h;
    
    const animationType = document.getElementById('animationType').value;
    
    draw();
    await new Promise(r => setTimeout(r, 100));
    
    const videoStream = canvas.captureStream(60);
    let combinedStream = videoStream;
    
    let audioContext = null;
    let audioSource = null;
    
    if (audioFile && audioElement) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await audioFile.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        
        const dest = audioContext.createMediaStreamDestination();
        audioSource = audioContext.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.loop = true;
        audioSource.connect(dest);
        
        combinedStream = new MediaStream([
          ...videoStream.getVideoTracks(),
          ...dest.stream.getAudioTracks()
        ]);
      } catch (e) {
        console.warn('تعذر دمج الصوت:', e);
        combinedStream = videoStream;
      }
    }
    
    let recorder;
    const options = { 
      mimeType: 'video/webm;codecs=vp9,opus',
      videoBitsPerSecond: 8000000
    };
    
    try {
      recorder = new MediaRecorder(combinedStream, options);
    } catch (e) {
      try {
        recorder = new MediaRecorder(combinedStream, { 
          mimeType: 'video/webm;codecs=vp8,opus' 
        });
      } catch (e2) {
        recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      }
    }
    
    const chunks = [];
    
    recorder.ondataavailable = (e) => {
      if (e.data.size > 0) chunks.push(e.data);
    };
    
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `resha-${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      
      if (audioSource) {
        try { audioSource.stop(); } catch(e) {}
      }
      if (audioContext) {
        try { audioContext.close(); } catch(e) {}
      }
      
      status.textContent = '✅ تم تحميل الفيديو';
      setTimeout(() => { status.style.display = 'none'; }, 3000);
    };
    
    recorder.start();
    
    if (audioSource && audioContext) {
      audioSource.start(0);
    }
    
    status.textContent = `🎬 جاري التسجيل (${seconds} ثواني)...`;
    
    const fps = 30;
    const totalFrames = seconds * fps;
    const animFrames = Math.floor(totalFrames * 0.4);
    let frame = 0;
    
    const text = document.getElementById('textInput').value || ' ';
    
    const animate = () => {
      if (frame >= totalFrames) {
        recorder.stop();
        draw();
        return;
      }
      
      const progress = frame < animFrames ? frame / animFrames : 1;
      
      let anim;
      switch(animationType) {
        case 'fade':       anim = animFade(progress); break;
        case 'pulse':      anim = animPulse(progress); break;
        case 'typewriter': anim = animTypewriter(progress, text); break;
        case 'slide':      anim = animSlide(progress); break;
        case 'zoom':       anim = animZoom(progress); break;
        default:           anim = animFade(progress);
      }
      
      drawWithAnimation(anim);
      frame++;
      requestAnimationFrame(animate);
    };
    
    animate();
    
  } catch (e) {
    console.error(e);
    status.textContent = '❌ المتصفح لا يدعم (جرّب Chrome)';
  }
}

const NIBRAS_URL = "https://nibras-al.onrender.com/";
let nibrasLoaded = false;

function toggleNibras() {
  const chat = document.getElementById('nibras-chat');
  const iframe = document.getElementById('nibras-iframe');
  const loader = document.getElementById('nibras-loader');

  if (chat.classList.contains('active')) {
    chat.classList.remove('active');
  } else {
    if (!nibrasLoaded) {
      iframe.src = NIBRAS_URL;
      iframe.onload = () => { loader.style.display = 'none'; };
      setTimeout(() => { loader.style.display = 'none'; }, 8000);
      nibrasLoaded = true;
    }
    chat.classList.add('active');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('nibras-chat').classList.remove('active');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('✅ SW مسجل:', reg.scope))
      .catch(err => console.warn('⚠️ SW فشل:', err));
  });
}

window.addEventListener('load', () => {
  setTimeout(draw, 300);
  draw();
