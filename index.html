<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="نبراس GP">
<title>🖌️ ريشة — استوديو الصور والفيديوهات | نبراس GP</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="resha-192.png">
<meta name="theme-color" content="#667eea">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&family=Tajawal:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: 'Cairo', sans-serif; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    margin: 0;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .header-title { color: #fff; text-align: center; margin-bottom: 14px; }
  .header-title .logo {
    width: 45px; height: 45px;
    margin: 0 auto 6px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    display: block;
  }
  .header-title p { font-size: 13px; opacity: 0.9; margin: 0; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: #fff;
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .tab {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: #6b7280;
    transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }

  .view { display: none; }
  .view.active { display: block; }

  canvas { 
    max-width: 100%; 
    height: auto;
    border-radius: 14px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: block;
    margin: 0 auto;
  }
  input[type="color"] { 
    height: 44px; width: 100%;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #e5e7eb; padding: 2px;
  }
  input[type="text"], textarea, select, input[type="file"] {
    width: 100%; padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    background: #fafafa;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #667eea; background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  label {
    display: block; font-weight: 700;
    color: #374151; margin-bottom: 6px; font-size: 13px;
  }
  .field { margin-bottom: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .templates { display: flex; flex-wrap: wrap; gap: 6px; }

  .palette-dropdown {
    background: #f8fafc;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .palette-dropdown summary {
    padding: 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    color: #374151;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .palette-dropdown summary::-webkit-details-marker { display: none; }
  .palette-dropdown summary::after {
    content: '▼';
    font-size: 12px;
    color: #6b7280;
    transition: transform 0.2s;
  }
  .palette-dropdown[open] summary::after {
    transform: rotate(180deg);
  }
  .palette-dropdown[open] {
    border-color: #667eea;
  }
  .palette-dropdown .palette {
    padding: 12px;
    border-top: 2px solid #e5e7eb;
    background: #fff;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .palette-color {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.2s;
  }
  .palette-color:hover { transform: scale(1.1); }
  .palette-color.active { border-color: #111; }

  .template-btn {
    padding: 8px 12px; border-radius: 8px;
    border: 2px solid #e5e7eb; background: #fff;
    cursor: pointer; font-family: 'Cairo', sans-serif;
    font-weight: 700; font-size: 12px; color: #6b7280;
  }
  .template-btn.active {
    border-color: #667eea; background: #eef2ff; color: #4338ca;
  }
  .btn {
    padding: 12px 18px; border-radius: 12px; border: none;
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: 14px; cursor: pointer; color: white;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; flex: 1; }
  .btn-green { background: #10b981; flex: 1; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #ef4444; }
  .btn-small {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: #ef4444; color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .slide-item {
    background: #f8fafc;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .slide-item .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .slide-item .slide-num {
    font-weight: 800;
    color: #4338ca;
    font-size: 14px;
  }
  .duration-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .dur-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #6b7280;
  }
  .dur-btn.active {
    border-color: #10b981; background: #ecfdf5; color: #047857;
  }
  .anim-btn {
    padding: 8px 12px;
    border-radius: 8px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #6b7280;
  }
  .anim-btn.active {
    border-color: #8b5cf6; background: #f5f3ff; color: #6d28d9;
  }
  .animations { display: flex; flex-wrap: wrap; gap: 6px; }

  .add-slide-btn {
    width: 100%;
    padding: 16px;
    border: 2px dashed #cbd5e1;
    background: #f8fafc;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    color: #64748b;
    font-size: 14px;
  }
  .add-slide-btn:hover { border-color: #667eea; color: #4338ca; }

  .audio-box {
    background: #f0f9ff;
    border: 2px solid #bae6fd;
    border-radius: 14px;
    padding: 16px;
  }
  .audio-info {
    font-size: 13px;
    color: #0369a1;
    margin-top: 8px;
    padding: 8px;
    background: #e0f2fe;
    border-radius: 8px;
    text-align: center;
    font-weight: 700;
  }

  .convert-box {
    margin-top: 12px;
  }
  .convert-box a {
    display: block;
    padding: 14px;
    background: #ea580c;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    text-align: center;
    transition: all 0.2s;
  }
  .convert-box a:hover {
    background: #c2410c;
    transform: scale(1.02);
  }

  #slideshow-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    display: none;
    flex-direction: column;
  }
  #slideshow-overlay.active { display: flex; }
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #fff;
    width: 0%;
  }
  .slide-canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #slideshow-canvas {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
  }
  .slide-controls {
    padding: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .slide-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }
  .dot.active { background: #fff; }

  .footer {
    text-align: center; color: #fff;
    font-size: 13px; padding: 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 14px; margin-top: 16px;
    font-weight: 700;
  }
  .footer small {
    display: block; margin-top: 4px;
    opacity: 0.85; font-weight: 400;
  }
  .visitor-counter {
    display: inline-block;
    background: rgba(255,255,255,0.22);
    padding: 8px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s;
    animation: counterFadeIn 0.8s ease-out;
  }
  .visitor-counter:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
  }
  @keyframes counterFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .checkbox-label {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; padding: 12px;
    background: #f8fafc; border-radius: 12px;
    border: 2px solid #e5e7eb; font-weight: 700;
    color: #374151;
  }
  .checkbox-label input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #667eea;
  }
  @media (max-width: 480px) {
    .grid-2 { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    .palette { grid-template-columns: repeat(6, 1fr); }
  }

  #nibras-bubble {
    position: fixed; bottom: 24px; right: 24px;
    height: 56px; padding: 0 22px 0 18px;
    border-radius: 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(102,126,234,0.5);
    z-index: 9998;
    display: flex; align-items: center; gap: 10px;
  }
  @media (max-width: 480px) {
    #nibras-bubble {
      height: 50px; padding: 0 16px 0 14px;
      font-size: 14px; bottom: 16px; right: 16px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header-title">
    <img src="resha-512.png" alt="ريشة" class="logo">
    <p>استوديو الصور والفيديوهات</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('single', this)">🖼️ صور</button>
    <button class="tab" onclick="switchTab('slides', this)">🎬 فيديو</button>
  </div>

  <!-- تبويب الصور -->
  <div id="view-single" class="view active">

    <div class="card">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>

    <div class="card">
      <div class="field">
        <label>✍️ النص</label>
        <textarea id="textInput" rows="3">اترك أثراً جميلاً أينما ذهبت</textarea>
      </div>

      <div class="field">
        <label>🎭 القالب</label>
        <div class="templates" id="templates">
          <button class="template-btn active" data-tpl="quote">اقتباس</button>
          <button class="template-btn" data-tpl="gradient">تدرج</button>
          <button class="template-btn" data-tpl="solid">لون صلب</button>
          <button class="template-btn" data-tpl="frame">إطار</button>
        </div>
      </div>

      <div class="field">
        <label>🌈 ألوان جاهزة</label>
        <details class="palette-dropdown">
          <summary>اختر لوناً</summary>
          <div class="palette" id="palette"></div>
        </details>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>🎨 الخلفية</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="field">
          <label>✏️ لون النص</label>
          <input type="color" id="textColor" value="#000000">
        </div>
      </div>

      <div class="field">
        <label>📝 الخط</label>
        <select id="fontSelect">
          <option value="Cairo">Cairo — حديث</option>
          <option value="Amiri">Amiri — كلاسيكي</option>
          <option value="Tajawal">Tajawal — أنيق</option>
          <option value="Rubik">Rubik — عصري</option>
        </select>
      </div>

      <div class="field">
        <label>📐 القياس</label>
        <select id="sizeSelect">
          <option value="1080x1080">مربع (Post)</option>
          <option value="1080x1920">طويل (Story)</option>
          <option value="1200x675">عريض (Twitter)</option>
          <option value="1080x1350">عمودي (Instagram)</option>
        </select>
      </div>

      <div class="field">
        <label>🏷️ التوقيع</label>
        <input type="text" id="signature" value="@username">
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="showCopyright" checked onchange="drawSingle()">
          <span>حقوق نبراس GP</span>
        </label>
      </div>

      <div class="field">
        <label>🖼️ صورة خلفية</label>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn-small" style="margin-top:8px;" onclick="clearImage()">🗑️ حذف الصورة</button>
      </div>

      <div class="field">
        <label>💾 التصدير</label>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="downloadSingle()">💾 تحميل PNG</button>
          <button class="btn btn-purple" onclick="randomize()">🎲</button>
        </div>
      </div>
    </div>

  </div>

  <!-- تبويب الفيديو -->
  <div id="view-slides" class="view">

    <div class="card">
      <div class="field">
        <label>📐 القياس</label>
        <select id="slidesSize">
          <option value="1080x1920">طويل (Story)</option>
          <option value="1080x1080">مربع (Post)</option>
          <option value="1200x675">عريض (Twitter)</option>
          <option value="1080x1350">عمودي (Instagram)</option>
        </select>
      </div>

      <div class="field">
        <label>🏷️ التوقيع</label>
        <input type="text" id="slidesSig" value="@username">
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="slidesCopy" checked>
          <span>حقوق نبراس GP</span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="audio-box">
        <div class="field">
          <label>🎵 الصوت</label>
          <input type="file" id="audioUpload" accept="audio/*">
          <div id="audioInfo" class="audio-info" style="display:none;"></div>
          <button class="btn-small" style="margin-top:8px;" onclick="clearAudio()">🗑️ حذف الصوت</button>
        </div>

        <div class="field">
          <label class="checkbox-label">
            <input type="checkbox" id="audioLoop" checked>
            <span>🔁 تكرار الصوت</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="slidesList"></div>
      <button class="add-slide-btn" onclick="addSlide()">➕ إضافة مقطع</button>
    </div>

    <div class="card">
      <div class="btn-row">
        <button class="btn btn-primary" onclick="playSlideshow()">▶️ تشغيل</button>
        <button class="btn btn-green" onclick="exportSlidesVideo()">🎬 تصدير فيديو</button>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-purple" onclick="exportAllImages()">🖼️ تصدير صور</button>
        <button class="btn btn-red" onclick="clearAllSlides()">🗑️ حذف الكل</button>
      </div>
      
      <div class="convert-box">
        <a href="https://cloudconvert.com/webm-to-mp4" target="_blank">
          🔄 تحويل إلى MP4
        </a>
      </div>
      
      <div id="slideStatus" style="margin-top:12px;padding:10px;background:#f1f5f9;border-radius:10px;text-align:center;font-weight:700;color:#475569;display:none;"></div>
    </div>

  </div>

  <div class="footer">
    <div class="visitor-counter" id="visitorCounter">👁️ جاري التحميل...</div>
    جميع الحقوق محفوظة © نبراس GP 2026
    <small>🖌️ ريشة — استوديو الصور والفيديوهات</small>
  </div>

</div>

<div id="slideshow-overlay">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="slide-canvas-wrap">
    <canvas id="slideshow-canvas"></canvas>
  </div>
  <div class="slide-dots" id="slideDots"></div>
  <div class="slide-controls">
    <button class="btn btn-red" onclick="stopSlideshow()">✕</button>
    <button class="btn btn-primary" onclick="nextSlide()">التالي ➡️</button>
  </div>
</div>

<button id="nibras-bubble" onclick="window.open('https://nibras-al.onrender.com/','_blank')">✨ اسأل نبراس</button>

<script>
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + tab).classList.add('active');
  if (tab === 'single') drawSingle();
  else renderSlides();
}

let audioFile = null;
let audioURL = null;
let audioElement = null;

document.getElementById('audioUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  audioFile = file;
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(file);
  audioElement = new Audio(audioURL);
  const info = document.getElementById('audioInfo');
  info.style.display = 'block';
  info.textContent = '🎵 ' + file.name;
});

function clearAudio() {
  audioFile = null;
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = null;
  audioElement = null;
  document.getElementById('audioUpload').value = '';
  document.getElementById('audioInfo').style.display = 'none';
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let currentTemplate = 'quote';
let bgImage = null;

const PALETTE = [
  '#dc2626', '#ea580c', '#f59e0b', '#facc15',
  '#84cc16', '#16a34a', '#10b981', '#14b8a6',
  '#0891b2', '#0ea5e9', '#3b82f6', '#6366f1',
  '#8b5cf6', '#a855f7', '#d946ef', '#ec4899',
  '#0f172a', '#1e293b', '#334155', '#475569',
  '#64748b', '#94a3b8', '#cbd5e1', '#f1f5f9',
  '#7c2d12', '#9a3412', '#78350f', '#854d0e',
  '#365314', '#14532d', '#0c4a6e', '#3b0764'
];

function buildPalette() {
  const wrap = document.getElementById('palette');
  if (!wrap) return;
  wrap.innerHTML = '';
  PALETTE.forEach(c => {
    const div = document.createElement('div');
    div.className = 'palette-color';
    div.style.background = c;
    div.onclick = () => {
      document.getElementById('bgColor').value = c;
      document.querySelectorAll('.palette-color').forEach(p => p.classList.remove('active'));
      div.classList.add('active');
      drawSingle();
      document.querySelector('.palette-dropdown').removeAttribute('open');
    };
    wrap.appendChild(div);
  });
}

['textInput','bgColor','textColor','fontSelect','sizeSelect','signature'].forEach(id => {
  document.getElementById(id).addEventListener('input', drawSingle);
});
document.getElementById('showCopyright').addEventListener('change', drawSingle);

document.querySelectorAll('#templates .template-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#templates .template-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTemplate = btn.dataset.tpl;
    drawSingle();
  });
});

document.getElementById('imageUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { bgImage = img; drawSingle(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function clearImage() {
  bgImage = null;
  document.getElementById('imageUpload').value = '';
  drawSingle();
}

const ANIMATIONS = {
  none:       { label: 'بدون' },
  fade:       { label: 'تلاشي' },
  pulse:      { label: 'وميض' },
  typewriter: { label: 'كتابة' },
  slide:      { label: 'انزلاق يمين' },
  slideLeft:  { label: 'انزلاق يسار' },
  slideUp:    { label: 'انزلاق فوق' },
  zoom:       { label: 'تكبير' },
  shake:      { label: 'اهتزاز' }
};

function getAnimState(type, progress, fullText) {
  const p = Math.min(1, Math.max(0, progress));
  const eased = 1 - Math.pow(1 - p, 3);
  const state = { opacity: 1, offsetX: 0, offsetY: 0, scale: 1, visibleText: null };

  switch(type) {
    case 'fade':       state.opacity = eased; break;
    case 'pulse':      state.opacity = p < 0.5 ? p * 2 : 1;
                       state.scale = 1 + Math.sin(p * Math.PI * 2) * 0.08; break;
    case 'typewriter': state.visibleText = fullText.substring(0, Math.floor(p * fullText.length)); break;
    case 'slide':      state.opacity = eased; state.offsetX = (1 - eased) * 400; break;
    case 'slideLeft':  state.opacity = eased; state.offsetX = (1 - eased) * -400; break;
    case 'slideUp':    state.opacity = eased; state.offsetY = (1 - eased) * 400; break;
    case 'zoom':       state.opacity = eased; state.scale = 0.4 + eased * 0.6; break;
    case 'shake':      state.opacity = eased; state.offsetX = Math.sin(p * Math.PI * 12) * 20 * (1 - eased); break;
  }
  return state;
}

function drawOnCanvas(c, w, h, text, bg, fg, font, sig, showCopy, template, img, animState) {
  c.clearRect(0, 0, w, h);

  if (img) {
    c.drawImage(img, 0, 0, w, h);
  } else if (template === 'gradient') {
    const grad = c.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, bg);
    grad.addColorStop(1, shadeColor(bg, 50));
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);
  } else if (template === 'frame') {
    c.fillStyle = bg;
    c.fillRect(0, 0, w, h);
    c.strokeStyle = fg;
    c.lineWidth = 10;
    c.strokeRect(50, 50, w - 100, h - 100);
  } else {
    c.fillStyle = bg;
    c.fillRect(0, 0, w, h);
  }

  let anim = { opacity: 1, offsetX: 0, offsetY: 0, scale: 1, visibleText: null };
  if (animState) anim = animState;

  const visibleText = anim.visibleText !== null ? anim.visibleText : text;
  const fontSize = w / 16;

  c.save();
  c.globalAlpha = anim.opacity;
  c.fillStyle = fg;
  c.font = `bold ${fontSize}px "${font}", sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.direction = 'rtl';

  const lines = wrapText(c, visibleText, w * 0.85);
  const lineHeight = fontSize * 1.3;
  const totalHeight = lines.length * lineHeight;
  const startY = (h - totalHeight) / 2 + lineHeight / 2;

  if (anim.scale !== 1 || anim.offsetX !== 0 || anim.offsetY !== 0) {
    c.translate(w / 2 + anim.offsetX, h / 2 + anim.offsetY);
    c.scale(anim.scale, anim.scale);
    c.translate(-w / 2, -h / 2);
  }

  lines.forEach((line, i) => {
    if (line.trim() === '') return;
    c.fillText(line, w / 2, startY + i * lineHeight);
  });

  if (sig.trim()) {
    const sigSize = w / 28;
    c.font = `600 ${sigSize}px "${font}", sans-serif`;
    c.globalAlpha = anim.opacity * 0.85;
    c.fillText(sig, w / 2, h - sigSize * 2.5);
  }

  if (showCopy) {
    const copySize = w / 55;
    c.font = `600 ${copySize}px "Cairo", sans-serif`;
    c.globalAlpha = anim.opacity * 0.55;
    c.fillText('© نبراس GP', w / 2, h - copySize * 1.5);
  }
  c.restore();
}

function wrapText(c, text, maxWidth) {
  const paragraphs = text.split('\n');
  const lines = [];
  paragraphs.forEach(paragraph => {
    if (paragraph.trim() === '') { lines.push(''); return; }
    const words = paragraph.split(/\s+/);
    let current = '';
    words.forEach(word => {
      const test = current ? current + ' ' + word : word;
      if (c.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
  });
  return lines;
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + percent));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + percent));
  const b = Math.min(255, Math.max(0, (num & 0xff) + percent));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function randomize() {
  const fonts = ['Cairo','Amiri','Tajawal','Rubik'];
  const templates = ['quote','gradient','solid','frame'];
  
  document.getElementById('bgColor').value = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  document.getElementById('fontSelect').value = fonts[Math.floor(Math.random() * fonts.length)];
  
  const tplBtn = document.querySelector(`#templates [data-tpl="${templates[Math.floor(Math.random() * templates.length)]}"]`);
  document.querySelectorAll('#templates .template-btn').forEach(b => b.classList.remove('active'));
  tplBtn.classList.add('active');
  currentTemplate = tplBtn.dataset.tpl;
  
  drawSingle();
}

let slides = [];
let currentSlideIndex = 0;
let slideshowInterval = null;
let slideshowTimeout = null;

const DURATIONS = [5, 10, 15, 20, 30];
const ANIMATION_LIST = ['none','fade','pulse','typewriter','slide','slideLeft','slideUp','zoom','shake'];

function loadSlides() {
  try {
    const saved = localStorage.getItem('resha_slides');
    if (saved) slides = JSON.parse(saved);
    else slides = [createSlide(), createSlide()];
  } catch(e) {
    slides = [createSlide(), createSlide()];
  }
}

function createSlide() {
  return {
    id: Date.now() + Math.random(),
    text: 'النص',
    template: 'quote',
    bg: '#ffffff',
    fg: '#000000',
    font: 'Cairo',
    duration: 5,
    animation: 'fade'
  };
}

function saveSlides() {
  try {
    localStorage.setItem('resha_slides', JSON.stringify(slides));
  } catch(e) {}
}

function addSlide() {
  slides.push(createSlide());
  saveSlides();
  renderSlides();
}

function deleteSlide(id) {
  if (slides.length <= 1) {
    alert('لا يمكن حذف هذا المقطع');
    return;
  }
  slides = slides.filter(s => s.id !== id);
  saveSlides();
  renderSlides();
}

function updateSlide(id, field, value) {
  const slide = slides.find(s => s.id === id);
  if (slide) {
    slide[field] = value;
    saveSlides();
  }
}

function renderSlides() {
  const list = document.getElementById('slidesList');
  list.innerHTML = '';
  
  slides.forEach((slide, i) => {
    const div = document.createElement('div');
    div.className = 'slide-item';
    div.innerHTML = `
      <div class="slide-header">
        <span class="slide-num">🎬 ${i + 1}</span>
        <button class="btn-small" onclick="deleteSlide(${slide.id})">🗑️</button>
      </div>
      
      <div class="field">
        <label>✍️ النص</label>
        <textarea rows="2" oninput="updateSlide(${slide.id}, 'text', this.value)">${escapeHtml(slide.text)}</textarea>
      </div>
      
      <div class="field">
        <label>🎭 القالب</label>
        <div class="templates">
          ${['quote','gradient','solid','frame'].map(t => `
            <button class="template-btn ${slide.template === t ? 'active' : ''}" onclick="setSlideTemplate(${slide.id}, '${t}', this)">
              ${t === 'quote' ? 'اقتباس' : t === 'gradient' ? 'تدرج' : t === 'solid' ? 'صلب' : 'إطار'}
            </button>
          `).join('')}
        </div>
      </div>
      
      <div class="grid-2">
        <div class="field">
          <label>🎨 الخلفية</label>
          <input type="color" value="${slide.bg}" oninput="updateSlide(${slide.id}, 'bg', this.value)">
        </div>
        <div class="field">
          <label>✏️ لون النص</label>
          <input type="color" value="${slide.fg}" oninput="updateSlide(${slide.id}, 'fg', this.value)">
        </div>
      </div>
      
      <div class="field">
        <label>📝 الخط</label>
        <select onchange="updateSlide(${slide.id}, 'font', this.value)">
          <option value="Cairo" ${slide.font === 'Cairo' ? 'selected' : ''}>Cairo</option>
          <option value="Amiri" ${slide.font === 'Amiri' ? 'selected' : ''}>Amiri</option>
          <option value="Tajawal" ${slide.font === 'Tajawal' ? 'selected' : ''}>Tajawal</option>
          <option value="Rubik" ${slide.font === 'Rubik' ? 'selected' : ''}>Rubik</option>
        </select>
      </div>
      
      <div class="field">
        <label>🎬 الحركة</label>
        <div class="animations">
          ${ANIMATION_LIST.map(a => `
            <button class="anim-btn ${slide.animation === a ? 'active' : ''}" onclick="setSlideAnimation(${slide.id}, '${a}', this)">
              ${ANIMATIONS[a].label}
            </button>
          `).join('')}
        </div>
      </div>
      
      <div class="field">
        <label>⏱️ المدة</label>
        <div class="duration-row">
          ${DURATIONS.map(d => `
            <button class="dur-btn ${slide.duration === d ? 'active' : ''}" onclick="setSlideDuration(${slide.id}, ${d}, this)">
              ${d} ث
            </button>
          `).join('')}
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

function setSlideTemplate(id, tpl, btn) {
  updateSlide(id, 'template', tpl);
  btn.parentElement.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setSlideDuration(id, dur, btn) {
  updateSlide(id, 'duration', dur);
  btn.parentElement.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setSlideAnimation(id, anim, btn) {
  updateSlide(id, 'animation', anim);
  btn.parentElement.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function clearAllSlides() {
  if (!confirm('تأكيد الحذف')) return;
  slides = [createSlide(), createSlide()];
  saveSlides();
  renderSlides();
}

function drawSlideOnCanvas(c, slide, w, h, sig, showCopy, progress) {
  const animState = getAnimState(slide.animation, progress, slide.text);
  drawOnCanvas(c, w, h, slide.text, slide.bg, slide.fg, slide.font, sig, showCopy, slide.template, null, animState);
}

function playSlideshow() {
  if (slides.length === 0) return;
  
  const overlay = document.getElementById('slideshow-overlay');
  overlay.classList.add('active');
  
  const dots = document.getElementById('slideDots');
  dots.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('');
  
  if (audioFile && audioElement) {
    audioElement.currentTime = 0;
    audioElement.loop = document.getElementById('audioLoop').checked;
    audioElement.play().catch(e => console.warn('صوت:', e));
  }
  
  currentSlideIndex = 0;
  showSlide(0);
}

function showSlide(index) {
  if (index >= slides.length) {
    stopSlideshow();
    return;
  }
  
  currentSlideIndex = index;
  const slide = slides[index];
  const sig = document.getElementById('slidesSig').value;
  const showCopy = document.getElementById('slidesCopy').checked;
  const [w, h] = document.getElementById('slidesSize').value.split('x').map(Number);
  
  const canvas = document.getElementById('slideshow-canvas');
  canvas.width = w;
  canvas.height = h;
  const c = canvas.getContext('2d');
  
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
  
  const fill = document.getElementById('progressFill');
  fill.style.width = '0%';
  
  const duration = slide.duration * 1000;
  const startTime = Date.now();
  
  if (slideshowInterval) clearInterval(slideshowInterval);
  if (slideshowTimeout) clearTimeout(slideshowTimeout);
  
  try {
    drawSlideOnCanvas(c, slide, w, h, sig, showCopy, 0);
  } catch(e) { console.error('خطأ:', e); }
  
  slideshowInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(1, elapsed / duration);
    fill.style.width = (progress * 100) + '%';
    
    try {
      drawSlideOnCanvas(c, slide, w, h, sig, showCopy, progress);
    } catch(e) { console.error('خطأ:', e); }
    
    if (elapsed >= duration) {
      clearInterval(slideshowInterval);
      slideshowInterval = null;
      slideshowTimeout = setTimeout(() => showSlide(index + 1), 100);
    }
  }, 1000 / 30);
}

function nextSlide() {
  if (slideshowInterval) clearInterval(slideshowInterval);
  if (slideshowTimeout) clearTimeout(slideshowTimeout);
  slideshowInterval = null;
  slideshowTimeout = null;
  
  if (currentSlideIndex + 1 < slides.length) {
    showSlide(currentSlideIndex + 1);
  } else {
    stopSlideshow();
  }
}

function stopSlideshow() {
  if (slideshowInterval) clearInterval(slideshowInterval);
  if (slideshowTimeout) clearTimeout(slideshowTimeout);
  slideshowInterval = null;
  slideshowTimeout = null;
  
  document.getElementById('slideshow-overlay').classList.remove('active');
  if (audioElement) {
    audioElement.pause();
    audioElement.currentTime = 0;
  }
}

async function exportSlidesVideo() {
  if (slides.length === 0) return;
  
  const status = document.getElementById('slideStatus');
  status.style.display = 'block';
  status.textContent = '🎬 جاري التحضير...';
  
  try {
    const sig = document.getElementById('slidesSig').value;
    const showCopy = document.getElementById('slidesCopy').checked;
    const [w, h] = document.getElementById('slidesSize').value.split('x').map(Number);
    
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');
    
    drawSlideOnCanvas(tempCtx, slides[0], w, h, sig, showCopy, 0);
    await new Promise(r => setTimeout(r, 100));
    
    const videoStream = tempCanvas.captureStream(30);
    let combinedStream = videoStream;
    
    let localAudioCtx = null;
    let localAudioSource = null;
    
    if (audioFile) {
      try {
        localAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await audioFile.arrayBuffer();
        const audioBuffer = await localAudioCtx.decodeAudioData(arrayBuffer);
        
        const dest = localAudioCtx.createMediaStreamDestination();
        localAudioSource = localAudioCtx.createBufferSource();
        localAudioSource.buffer = audioBuffer;
        localAudioSource.loop = document.getElementById('audioLoop').checked;
        localAudioSource.connect(dest);
        
        combinedStream = new MediaStream([
          ...videoStream.getVideoTracks(),
          ...dest.stream.getAudioTracks()
        ]);
      } catch(e) {
        console.warn('تعذر دمج الصوت:', e);
        combinedStream = videoStream;
      }
    }
    
    let recorder;
    const options = { 
      mimeType: 'video/webm;codecs=vp9,opus',
      videoBitsPerSecond: 6000000
    };
    
    try {
      recorder = new MediaRecorder(combinedStream, options);
    } catch(e) {
      try {
        recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus' });
      } catch(e2) {
        recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      }
    }
    
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `resha-video-${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      
      if (localAudioSource) { try { localAudioSource.stop(); } catch(e) {} }
      if (localAudioCtx) { try { localAudioCtx.close(); } catch(e) {} }
      
      status.textContent = '✅ تم التحميل';
      setTimeout(() => status.style.display = 'none', 3000);
    };
    
    recorder.start();
    
    if (localAudioSource && localAudioCtx) {
      localAudioSource.start(0);
    }
    
    status.textContent = '🎬 جاري التسجيل...';
    
    for (let i = 0; i < slides.length; i++) {
      const slide = slides[i];
      const frameDuration = slide.duration * 1000;
      const startTime = Date.now();
      
      await new Promise(resolve => {
        const interval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(1, elapsed / frameDuration);
          
          try {
            drawSlideOnCanvas(tempCtx, slide, w, h, sig, showCopy, progress);
          } catch(e) { console.error('خطأ:', e); }
          
          if (elapsed >= frameDuration) {
            clearInterval(interval);
            resolve();
          }
        }, 1000 / 30);
      });
    }
    
    recorder.stop();
    
  } catch(e) {
    console.error(e);
    status.textContent = '❌ خطأ';
  }
}

async function exportAllImages() {
  if (slides.length === 0) return;
  
  const sig = document.getElementById('slidesSig').value;
  const showCopy = document.getElementById('slidesCopy').checked;
  const [w, h] = document.getElementById('slidesSize').value.split('x').map(Number);
  
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w;
  tempCanvas.height = h;
  const c = tempCanvas.getContext('2d');
  
  for (let i = 0; i < slides.length; i++) {
    drawSlideOnCanvas(c, slides[i], w, h, sig, showCopy, 1);
    
    const link = document.createElement('a');
    link.download = `resha-${i + 1}.png`;
    link.href = tempCanvas.toDataURL('image/png');
    link.click();
    
    await new Promise(r => setTimeout(r, 300));
  }
  
  alert('✅ تم التحميل');
}

async function updateVisitorCounter() {
  const counter = document.getElementById('visitorCounter');
  if (!counter) return;
  
  try {
    const siteKey = 'resha_nibras_gp_2026';
    const response = await fetch(`https://api.countapi.xyz/hit/${siteKey}/visits`);
    const data = await response.json();
    
    const visits = data.value.toLocaleString('ar-EG');
    counter.textContent = `👁️ ${visits} زيارة`;
  } catch(e) {
    counter.textContent = '👁️ عداد';
    console.warn('فشل العداد:', e);
  }
}
