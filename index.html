<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="نبراس GP">
<title>🖌️ ريشة — استوديو الصور والفيديوهات | نبراس GP</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="resha-192.png">
<meta name="theme-color" content="#667eea">
<meta name="description" content="ريشة — استوديو الصور والفيديوهات العربية">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&family=Tajawal:wght@700&family=Rubik:wght@700&family=Almarai:wght@700&family=El+Messiri:wght@700&family=Reem+Kufi:wght@700&family=Lateef&family=Scheherazade+New:wght@700&family=Noto+Naskh+Arabic:wght@700&family=Noto+Kufi+Arabic:wght@700&family=Harmattan:wght@700&family=Mada:wght@700&family=Changa:wght@700&family=Lemonada:wght@700&family=Rakkas&family=Lalezar&family=Jomhuria&family=Aref+Ruqaa:wght@700&family=Gulzar&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body { 
    font-family: 'Cairo', sans-serif; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    margin: 0;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .header-title { color: #fff; text-align: center; margin-bottom: 14px; }
  .header-title .logo {
    width: 45px; height: 45px;
    margin: 0 auto 6px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    display: block;
  }
  .header-title p { font-size: 13px; opacity: 0.9; margin: 0; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: #fff;
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .tab {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: #6b7280;
    transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }

  .view { display: none; }
  .view.active { display: block; }

  canvas { 
    max-width: 100%; 
    height: auto;
    border-radius: 14px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: block;
    margin: 0 auto;
  }
  input[type="color"] { 
    height: 44px; width: 100%;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #e5e7eb; padding: 2px;
  }
  input[type="text"], textarea, select, input[type="file"] {
    width: 100%; padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    background: #fafafa;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #667eea; background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  label {
    display: block; font-weight: 700;
    color: #374151; margin-bottom: 6px; font-size: 13px;
  }
  .field { margin-bottom: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .palette-dropdown, .templates-dropdown, .fonts-dropdown, .library-dropdown {
    background: #f8fafc;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .palette-dropdown summary, .templates-dropdown summary, .fonts-dropdown summary, .library-dropdown summary {
    padding: 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    color: #374151;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .palette-dropdown summary::-webkit-details-marker,
  .templates-dropdown summary::-webkit-details-marker,
  .fonts-dropdown summary::-webkit-details-marker,
  .library-dropdown summary::-webkit-details-marker { display: none; }
  .palette-dropdown summary::after,
  .templates-dropdown summary::after,
  .fonts-dropdown summary::after,
  .library-dropdown summary::after {
    content: '▼';
    font-size: 12px;
    color: #6b7280;
    transition: transform 0.2s;
  }
  .palette-dropdown[open] summary::after,
  .templates-dropdown[open] summary::after,
  .fonts-dropdown[open] summary::after,
  .library-dropdown[open] summary::after {
    transform: rotate(180deg);
  }
  .palette-dropdown[open], .templates-dropdown[open], .fonts-dropdown[open], .library-dropdown[open] {
    border-color: #667eea;
  }
  .dropdown-content {
    padding: 12px;
    border-top: 2px solid #e5e7eb;
    background: #fff;
    max-height: 400px;
    overflow-y: auto;
  }
  .dropdown-category {
    font-size: 12px;
    font-weight: 800;
    color: #4338ca;
    padding: 8px 4px 6px;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 8px;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .palette-color {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.2s;
  }
  .palette-color:hover { transform: scale(1.1); }
  .palette-color.active { border-color: #111; }

  .template-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .template-card {
    padding: 12px 8px;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #6b7280;
    transition: all 0.2s;
  }
  .template-card:hover {
    border-color: #667eea;
    background: #eef2ff;
    color: #4338ca;
    transform: translateY(-2px);
  }
  .template-card.active {
    border-color: #667eea;
    background: #eef2ff;
    color: #4338ca;
  }
  .template-preview {
    width: 100%;
    height: 50px;
    border-radius: 6px;
    margin-bottom: 6px;
    background: #f1f5f9;
    position: relative;
    overflow: hidden;
  }

  .font-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .font-item {
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    font-size: 18px;
    color: #374151;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .font-item:hover {
    border-color: #667eea;
    background: #eef2ff;
  }
  .font-item.active {
    border-color: #667eea;
    background: #eef2ff;
  }
  .font-item .font-name {
    font-size: 18px;
  }
  .font-item .font-desc {
    font-size: 11px;
    color: #6b7280;
  }

  .library-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .library-item {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
    background-size: cover;
    background-position: center;
  }
  .library-item:hover {
    transform: scale(1.05);
    border-color: #667eea;
  }
  .library-item.active {
    border-color: #4338ca;
  }

  .checkbox-label {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; padding: 12px;
    background: #f8fafc; border-radius: 12px;
    border: 2px solid #e5e7eb; font-weight: 700;
    color: #374151;
  }
  .checkbox-label input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #667eea;
  }
  .btn {
    padding: 12px 18px; border-radius: 12px; border: none;
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: 14px; cursor: pointer; color: white;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; flex: 1; }
  .btn-green { background: #10b981; flex: 1; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #ef4444; }
  .btn-small {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: #ef4444; color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .slide-item {
    background: #f8fafc;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .slide-item .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .slide-item .slide-num {
    font-weight: 800;
    color: #4338ca;
    font-size: 14px;
  }
  .duration-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .dur-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #6b7280;
  }
  .dur-btn.active {
    border-color: #10b981; background: #ecfdf5; color: #047857;
  }
  .anim-btn {
    padding: 8px 12px;
    border-radius: 8px;
    border: 2px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #6b7280;
  }
  .anim-btn.active {
    border-color: #8b5cf6; background: #f5f3ff; color: #6d28d9;
  }
  .animations { display: flex; flex-wrap: wrap; gap: 6px; }

  .add-slide-btn {
    width: 100%;
    padding: 16px;
    border: 2px dashed #cbd5e1;
    background: #f8fafc;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    color: #64748b;
    font-size: 14px;
  }
  .add-slide-btn:hover { border-color: #667eea; color: #4338ca; }

  .audio-box {
    background: #f0f9ff;
    border: 2px solid #bae6fd;
    border-radius: 14px;
    padding: 16px;
  }
  .audio-info {
    font-size: 13px;
    color: #0369a1;
    margin-top: 8px;
    padding: 8px;
    background: #e0f2fe;
    border-radius: 8px;
    text-align: center;
    font-weight: 700;
  }

  .convert-box {
    margin-top: 12px;
  }
  .convert-box a {
    display: block;
    padding: 14px;
    background: #ea580c;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    text-align: center;
    transition: all 0.2s;
  }
  .convert-box a:hover {
    background: #c2410c;
    transform: scale(1.02);
  }

  #slideshow-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    display: none;
    flex-direction: column;
  }
  #slideshow-overlay.active { display: flex; }
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #fff;
    width: 0%;
  }
  .slide-canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #slideshow-canvas {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
  }
  .slide-controls {
    padding: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .slide-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }
  .dot.active { background: #fff; }

  .footer {
    text-align: center; color: #fff;
    font-size: 13px; padding: 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 14px; margin-top: 16px;
    font-weight: 700;
  }
  .footer small {
    display: block; margin-top: 4px;
    opacity: 0.85; font-weight: 400;
  }
  .footer-links {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .footer-links a {
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    padding: 5px 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .footer-links a:hover {
    background: rgba(255,255,255,0.28);
    transform: translateY(-1px);
  }

  @media (max-width: 480px) {
    .grid-2 { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    .palette { grid-template-columns: repeat(6, 1fr); }
    .template-grid { grid-template-columns: repeat(2, 1fr); }
    .library-grid { grid-template-columns: repeat(2, 1fr); }
  }

  #nibras-bubble {
    position: fixed; bottom: 20px; right: 20px;
    height: 44px; padding: 0 18px 0 14px;
    border-radius: 22px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 13px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(102,126,234,0.45);
    z-index: 9998;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  @media (max-width: 480px) {
    #nibras-bubble {
      height: 40px; padding: 0 14px 0 10px;
      font-size: 12px; bottom: 14px; right: 14px;
      gap: 5px;
    }
  }
</style>
</head>
