<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ريشة — المحرر</title>
<script data-goatcounter="https://resha.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700;800&family=Mada:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&fa mily=Readex+Pro:wght@400;700&family=Alexandria:wght@400;700;900&family=Rubik:wght@400;700&family=Changa:wght@400;700&fa mily=Lemonada:wght@400;700&family=El+Messiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Noto+Kufi+Arabic:wght@400 ;700&family=Kufam:wght@400;700&family=Amiri:wght@400;700&family=Amiri+Quran&family=شهرزاد+جديد:wght@400;700&family =Noto+Naskh+Arabic:wght@400;700&family=Lateef&family=Harmattan&family=Markazi+Text:wght@400;700&family=ميرزا:wght@400;70 0&family=Gulzar&family=Aref+Ruqaa:wght@400;700&family=Alkalami&family=Katibeh&family=Qahiri&family=Rakkas&family=Lalezar&family=Jomhuria&family=Marhey:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700&family=Saira:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  :جذر {
    --الأساسي: #6366f1؛
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-light: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  جسم {
    font-family: 'Cairo', sans-serif;
    الخلفية: متغير(--bg)؛
    اللون: متغير(--text)؛
    الحد الأدنى للارتفاع: 100vh؛
    overflow-x: hidden;
  }
  
  /* ═══ رأس الصفحة ═══ */
  .header {
    الخلفية: تدرج خطي (135 درجة، #6366f1 0%، #8b5cf6 100%)؛
    الحشو: 16 بكسل 20 بكسل؛
    العرض: مرن؛
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(99,102,241,0.2);
    الموقع: لاصق؛
    أعلى: 0؛
    مؤشر z: 100؛
  }
  .header-logo {
    العرض: مرن؛
    align-items: center;
    الفجوة: 10 بكسل؛
    اللون: #fff;
  }
  .header-logo-icon {
    العرض: 40 بكسل؛
    الارتفاع: 40 بكسل؛
    الخلفية: rgba(255,255,255,0.2)؛
    border-radius: 12px;
    العرض: مرن؛
    align-items: center;
    justify-content: center;
    حجم الخط: 20 بكسل؛
    خاصية التمويه الخلفية: تمويه (10 بكسل)؛
  }
  .header-logo-text {
    حجم الخط: 18 بكسل؛
    وزن الخط: 900؛
  }
  .header-logo-sub {
    حجم الخط: 10 بكسل؛
    الشفافية: 0.85؛
    وزن الخط: 600؛
  }
  .header-btn {
    العرض: 40 بكسل؛
    الارتفاع: 40 بكسل؛
    الحدود: لا شيء؛
    الخلفية: rgba(255,255,255,0.15)؛
    اللون: #fff;
    border-radius: 12px;
    المؤشر: مؤشر؛
    حجم الخط: 18 بكسل؛
    العرض: مرن؛
    align-items: center;
    justify-content: center;
    الانتقال: جميعها 0.2 ثانية؛
  }
  .header-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }
  
  /* ═══ حاوية ═══ */
  .حاوية {
    أقصى عرض: 1200 بكسل؛
    margin: 0 auto;
    الحشو: 16 بكسل؛
  }
  
  /* ═══ مساحة الرسم ═══ */
  .canvas-wrapper {
    الخلفية: متغير(--card)؛
    border-radius: var(--radius);
    الحشو: 16 بكسل؛
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    العرض: مرن؛
    justify-content: center;
    align-items: center;
    الحد الأدنى للارتفاع: 300 بكسل؛
    صورة الخلفية:
      linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
      linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
    حجم الخلفية: 20 بكسل 20 بكسل؛
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  cc {
    نصف قطر الحدود: var(--radius-sm);
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    الحد الأقصى للعرض: 100%؛
    أقصى ارتفاع: 55vh؛
    touch-action: none;
    العرض: كتلة؛
    الخلفية: #fff;
  }
  .canvas-container .upper-canvas { touch-action: none !important; }
  
  /* محو الأمية شريط علامات التبويب محو الأمية */
  .tabs-bar {
    العرض: مرن؛
    الفجوة: 6 بكسل؛
    overflow-x: auto;
    الحشو: 4 بكسل 0 12 بكسل؛
    عرض شريط التمرير: لا شيء؛
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  
  .tab-btn {
    flex-shrink: 0;
    الحشو: 10 بكسل 18 بكسل؛
    الخلفية: متغير(--card)؛
    الحدود: 2 بكسل صلب var(--border);
    border-radius: 12px;
    اللون: متغير(--text-light)؛
    font-family: 'Cairo', sans-serif;
    وزن الخط: 700؛
    حجم الخط: 13 بكسل؛
    المؤشر: مؤشر؛
    الانتقال: جميعها 0.2 ثانية؛
    العرض: مرن؛
    align-items: center;
    الفجوة: 6 بكسل؛
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .tab-btn:active { transform: scale(0.96); }
  .tab-btn.active {
    الخلفية: تدرج خطي (135 درجة، متغير (--الأساسي)، #8b5cf6)؛
    اللون: #fff;
    لون الحدود: شفاف؛
    box-shadow: 0 4px 12px rgba(99,102,241,0.35);
  }
  
  /* ═══ لوحات التبويب ═══ */
  .tab-panels {
    الخلفية: متغير(--card)؛
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .panel { display: none; padding: 20px; }
  .panel.active { display: block; animation: fadeIn 0.2s; }
  @keyframes fadeIn {
    من { الشفافية: 0؛ التحويل: ترجمة Y(5 بكسل)؛ }
    إلى { الشفافية: 1؛ التحويل: ترجمة Y(0)؛ }
  }
  
  .panel-title {
    حجم الخط: 14 بكسل؛
    وزن الخط: 900؛
    اللون: متغير(--text)؛
    margin-bottom: 14px;
    العرض: مرن؛
    align-items: center;
    الفجوة: 8 بكسل؛
  }
  .panel-title::before {
    محتوى: ''؛
    العرض: 4 بكسل؛
    الارتفاع: 16 بكسل؛
    الخلفية: تدرج خطي (135 درجة، متغير (--الأساسي)، #8b5cf6)؛
    border-radius: 2px;
  }
  
  /* ═══ المدخلات ═══ */
  منطقة نصية {
    العرض: 100%؛
    الحشو: 14 بكسل؛
    الحدود: 2 بكسل صلب var(--border);
    نصف قطر الحدود: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    حجم الخط: 14 بكسل؛
    اللون: متغير(--text)؛
    الخلفية: متغير(--bg)؛
    تغيير الحجم: عمودي؛
    الحد الأدنى للارتفاع: 70 بكسل؛
    أقصى ارتفاع: 200 بكسل؛
    الانتقال: جميعها 0.2 ثانية؛
  }
  textarea:focus {
    المخطط: لا يوجد؛
    لون الحدود: متغير(--الأساسي)؛
    الخلفية: #fff;
  }
  
  input[type="color"] {
    العرض: 100%؛
    الارتفاع: 44 بكسل؛
    الحشو: 3 بكسل؛
    الحدود: 2 بكسل صلب var(--border);
    نصف قطر الحدود: var(--radius-sm);
    المؤشر: مؤشر؛
    الخلفية: #fff;
  }
  
  input[type="text"], select {
    العرض: 100%؛
    الحشو: 12 بكسل 14 بكسل؛
    الحدود: 2 بكسل صلب var(--border);
    نصف قطر الحدود: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    حجم الخط: 14 بكسل؛
    وزن الخط: 600؛
    الخلفية: #fff;
    اللون: متغير(--text)؛
  }
  input[type="text"]:focus, select:focus {
    المخطط: لا يوجد؛
    لون الحدود: متغير(--الأساسي)؛
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  
  input[type="number"] {
    العرض: 100%؛
    الحشو: 12 بكسل 14 بكسل؛
    الحدود: 2 بكسل صلب var(--border);
    نصف قطر الحدود: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    حجم الخط: 14 بكسل؛
    وزن الخط: 700؛
    الخلفية: #fff;
    اللون: متغير(--text)؛
    text-align: center;
  }
  input[type="number"]:focus {
    المخطط: لا يوجد؛
    لون الحدود: متغير(--الأساسي)؛
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  
  input[type="range"] {
    العرض: 100%؛
    -webkit-appearance: none;
    الارتفاع: 6 بكسل؛
    border-radius: 3px;
    الخلفية: متغير(--border)؛
    المخطط: لا يوجد؛
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    العرض: 24 بكسل؛
    الارتفاع: 24 بكسل؛
    border-radius: 50%;
    الخلفية: تدرج خطي (135 درجة، متغير (--الأساسي)، #8b5cf6)؛
    المؤشر: مؤشر؛
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(99,102,241,0.4);
  }
  
  .field { margin-bottom: 16px; }
  ملصق {
    العرض: كتلة؛
    وزن الخط: 700؛
    حجم الخط: 12 بكسل؛
    اللون: متغير(--text-light)؛
    margin-bottom: 8px;
  }
  .field-value {
    وزن الخط: 900؛
    اللون: متغير(--الأساسي)؛
    حجم الخط: 14 بكسل؛
  }
  
  /* ═══ أزرار ═══ */
  .btn-col { display: flex; flex-direction: column; gap: 8px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  
  .btn {
    الحشو: 13 بكسل 18 بكسل؛
    الحدود: لا شيء؛
    نصف قطر الحدود: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    وزن الخط: 800؛
    حجم الخط: 14 بكسل؛
    المؤشر: مؤشر؛
    الانتقال: جميعها 0.2 ثانية؛
    العرض: مرن؛
    align-items: center;
    justify-content: center;
    الفجوة: 8 بكسل؛
    اللون: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--primary), #8b5cf6); }
  .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
  .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .btn-gray { background: linear-gradient(135deg, #64748b, #475569); }
  .btn-light {
    الخلفية: متغير(--card)؛
    اللون: متغير(--text)؛
    الحدود: 2 بكسل صلب var(--border);
  }
  
  /* ═══ شبكة الألوان ═══ */
  .color-grid {
    العرض: شبكة؛
    grid-template-columns: repeat(8, 1fr);
    الفجوة: 6 بكسل؛
    margin-top: 10px;
  }
  .color-swatch {
    نسبة العرض إلى الارتفاع: 1؛
    border-radius: 8px;
    المؤشر: مؤشر؛
    border: 2px solid transparent;
    الانتقال: جميعها 0.15 ثانية؛
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.active { border-color: var(--text); transform: scale(1.05); }
  
  /* ═══ شبكة الخطوط ═══ */
  .font-grid {
    العرض: شبكة؛
    grid-template-columns: 1fr;
    الفجوة: 8 بكسل؛
    أقصى ارتفاع: 400 بكسل؛
    overflow-y: auto;
    الحشو: 4 بكسل؛
    الخلفية: متغير(--bg)؛
    نصف قطر الحدود: var(--radius-sm);
    الحدود: 2 بكسل صلب var(--border);
  }
  .font-btn {
    الحشو: 14 بكسل 16 بكسل؛
    الحدود: 2 بكسل صلب var(--border);
    border-radius: 10px;
    الخلفية: #fff;
    المؤشر: مؤشر؛
    الانتقال: جميعها 0.15 ثانية؛
    text-align: right;
    العرض: مرن؛
    align-items: center;
    justify-content: space-between;
    الفجوة: 10 بكسل؛
  }
  .font-btn:active { transform: scale(0.98); }
  .font-btn.active {
    لون الحدود: متغير(--الأساسي)؛
    الخلفية: متغير(--primary-light)؛
  }
  .font-preview {
    حجم الخط: 18 بكسل؛
    اللون: متغير(--text)؛
    المرونة: 1؛
  }
  .font-name {
    حجم الخط: 10 بكسل؛
    اللون: متغير(--text-light)؛
    وزن الخط: 700؛
    الاتجاه: من اليسار إلى اليمين؛
    الخلفية: متغير(--bg)؛
    الحشو: 3 بكسل 8 بكسل؛
    border-radius: 6px;
    white-space: nowrap;
  }
  
  /* ═══ منتقي الجدول ═══ */
  .table-picker-btn {
    العرض: 100%؛
    الحشو: 14 بكسل؛
    الخلفية: متغير(--card)؛
    الحدود: 2 بكسل صلب var(--border);
    نصف قطر الحدود: var(--radius-sm);
    اللون: متغير(--text)؛
    font-family: 'Cairo', sans-serif;
    وزن الخط: 800؛
    حجم الخط: 14 بكسل؛
    المؤشر: مؤشر؛
    العرض: مرن؛
    align-items: center;
    justify-content: center;
    الفجوة: 8 بكسل؛
    الانتقال: جميعها 0.2 ثانية؛
  }
  .table-picker-btn:active { transform: scale(0.98); }
  .table-picker-btn:hover {
    لون الحدود: متغير(--الأساسي)؛
    اللون: متغير(--الأساسي)؛
    الخلفية: متغير(--primary-light)؛
  }
  
  .table-picker-popup {
    الوضع: ثابت؛
    الخلفية: #fff;
    border-radius: 12px;
    الحشو: 12 بكسل؛
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    مؤشر z: 1000؛
    العرض: لا شيء؛
    الحدود: 2 بكسل صلب var(--border);
  }
  .table-picker-popup.active { display: block; }
  
  .table-picker-grid {
    العرض: شبكة؛
    grid-template-columns: repeat(8, 26px);
    grid-template-rows: repeat(8, 26px);
    الفجوة: 2 بكسل؛
  }
  .table-picker-cell {
    العرض: 26 بكسل؛
    الارتفاع: 26 بكسل؛
    الخلفية: #f1f5f9؛
    border: 1px solid #cbd5e1;
    المؤشر: مؤشر؛
    الانتقال: الخلفية 0.1 ثانية؛
    border-radius: 3px;
  }
  .table-picker-cell.active {
    الخلفية: متغير(--الأساسي)؛
    لون الحدود: متغير(--الأساسي)؛
  }
  
  .table-picker-label {
    text-align: center;
    حجم الخط: 13 بكسل؛
    وزن الخط: 900؛
    اللون: متغير(--الأساسي)؛
    margin-top: 10px;
    الحشو: 6 بكسل؛
    الخلفية: متغير(--primary-light)؛
    border-radius: 8px;
  }
  
  /* ═══ تذييل الصفحة ═══ */
  .footer {
    text-align: center;
    الحشو: 24 بكسل 16 بكسل؛
    اللون: متغير(--text-light)؛
    حجم الخط: 12 بكسل؛
  }
  .footer a {
    اللون: متغير(--الأساسي)؛
    text-decoration: none;
    وزن الخط: 700؛
  }
  
  /* ═══ فاصل ═══ */
  .divider {
    الارتفاع: 1 بكسل؛
    الخلفية: متغير(--border)؛
    margin: 16px 0;
  }
  
  /* ═══ متجاوب ═══ */
  @media (min-width: 900px) {
    .editor-layout {
      العرض: شبكة؛
      grid-template-columns: 1.4fr 1fr;
      الفجوة: 16 بكسل؛
      align-items: start;
    }
    .canvas-wrapper { position: sticky; top: 90px; }
  }
  @media (max-width: 600px) {
    .container { padding: 10px; }
    .header { padding: 12px 14px; }
    .panel { padding: 14px; }
    .tab-btn { padding: 9px 14px; font-size: 12px; }
    .table-picker-grid {
      grid-template-columns: repeat(6, 28px);
      grid-template-rows: repeat(6, 28px);
    }
    .table-picker-cell { width: 28px; height: 28px; }
  }
</style>
</head>
<body>

<!-- ═══ رأس الصفحة ═══ -->
<div class="header">
  <div class="header-logo">
    <div class="header-logo-icon">🖌️</div>
    <div>
      <div class="header-logo-text">ريشة</div>
      <div class="header-logo-sub">المحرر المتقدم</div>
    </div>
  </div>
  <div>
    <button class="header-btn" onclick="exportPNG()" title="تحميل">⬇</button>
  </div>
</div>

<!-- ═══ الحاوية الرئيسية ═══ -->
<div class="container">
  <div class="editor-layout">
    
    <!-- ═══ Canvas ═══ -->
    <div class="canvas-wrapper">
      <canvas id="c" width="1080" height="1080"></canvas>
    </div>

    <!-- ═══ أدوات ═══ -->
    <div>
      
      <!-- شريط علامات التبويب -->
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="toggleTab('text', this)">📝 نص</button>
        <button class="tab-btn" onclick="toggleTab('image', this)">🖼️ صور</button>
        <button class="tab-btn" onclick="toggleTab('shape', this)">🔷 علامة تبويب</button>
        <button class="tab-btn" onclick="toggleTab('table', this)">📊 جدول</button>
        <button class="tab-btn" onclick="toggleTab('edit', this)">⚙️ تعديل</button>
        <button class="tab-btn" onclick="toggleTab('draw', this)">✏️ رسم</button>
        <button class="tab-btn" onclick="toggleTab('filter', this)">🎨 فلاتر</button>
      </div>
      
      <!-- لوحات -->
      <div class="tab-panels">

        <!-- مذكرات مستندات مذكرات مذكرات -->
        <div id="panel-text" class="panel active">
          <div class="panel-title">النص</div>
          
          <div class="field">
            <textarea id="textInput"rows="3" placeholder="اكتب رسالتك هنا..."></textarea>

      return font.name.toLowerCase().indexOf(term) !== -1 || font.label.indexOf(filter) !== -1;

  document.addEventListener('click', function(e) {
    var popup = document.getElementById('tablePickerPopup');
    إذا كانت قائمة فئات النافذة المنبثقة تحتوي على "نشط" ولم تكن تحتوي على "الهدف" {
      closeTablePicker();
    }
  });

  window.insertTable = function(rows, cols) {
    var borderColor = document.getElementById('tableBorderColor').value;
    var bgColor = document.getElementById('tableBgColor').value;
    var borderWidth = parseInt(document.getElementById('borderWidthSlider').value);
    
    var cellWidth = 180;
    var cellHeight = 90;
    var totalWidth = cols * cellWidth;
    var TotalHeight =rows * cellHeight;
    فار ستارتكس = 540 - إجمالي العرض / 2؛
    فار ستارتي = 540 - إجمالي الارتفاع / 2؛
    
    var objects = [];
    
    for (var r = 0; r < rows; r++) {
      لـ (var c = 0; c < cols; c++) {
        var x = startX + c * cellWidth;
        var y = startY + r * cellHeight;
        
        var rect = new fabric.Rect({
          اليسار: س، الأعلى: ص،
          العرض: عرض الخلية، الارتفاع: ارتفاع الخلية،
          لون التعبئة: bgColor، لون الخط: borderColor، عرض الخط: borderWdth،
          قابل للتحديد: خطأ، مرتبط بالحدث: خطأ
          originX: 'يسار', originY: 'أعلى'
        });
        objects.push(rect);
        
        var cellText = new fabric.IText('', {
          اليسار: س + عرض الخلية / 2،
          أعلى: ص + ارتفاع الخلية / 2،
          fontFamily: 'Cairo', fontSize: 32, fill: '#000000',
          الاتجاه: 'rtl'، محاذاة النص: 'وسط'،
          originX: 'center', originY: 'center',
          الحشو: 5، قابل للتعديل: صحيح،
          hasControls: false, hasBorders: false,
          lockUniScaling: true,
          قابل للتحديد: صحيح، مرتبط بالأحداث: صحيح
          لون الخلفية: شفاف
        });
        objects.push(cellText);
      }
    }
    
    var group = new fabric.Group(objects, {
      اليسار: 540، الأعلى: 540،
      originX: 'center', originY: 'center',
      الحشو: 10،
      subTargetCheck: true, interactive: true,
      hasControls: true, hasBorders: true,
      قفل التوسيع الأحادي: خطأ
    });
    
    canvas.add(group);
    canvas.setActiveObject(group);
    canvas.renderAll();
  };

  document.getElementById('borderWidthSlider').addEventListener('input', function(e) {
    document.getElementById('borderWidthValue').textContent = e.target.value;
  });

  // محو الأمية أدوات التطوير محو الأمية
  window.bringForward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { تنبيه('اختر هيكلياً'); يعود؛ }
    canvas.bringForward(obj); canvas.renderAll();
  };
  window.sendBackward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { تنبيه('اختر هيكلياً'); يعود؛ }
    canvas.sendBackwards(obj); canvas.renderAll();
  };
  window.duplicateSelected = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { تنبيه('اختر هيكلياً'); يعود؛ }
    obj.clone(function(cloned) {
      cloned.set({ left: cloned.left + 30, top: cloned.top + 30 });
      canvas.add(cloned); canvas.setActiveObject(cloned); canvas.renderAll();
    });
  };
  window.deleteSelected = function() {
    var objs = Canvas.getActiveObjects();
    if (objs.length === 0) { تنبيه('اختر هيكلاً الجمعة'); يعود؛ }
    objs.forEach(function(o) { canvas.remove(o); });
    canvas.discardActiveObject(); canvas.renderAll();
  };

  window.straightenSelected = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { تنبيه('اختر هيكلياً'); يعود؛ }
    obj.set('angle', 0);
    canvas.renderAll();
    document.getElementById('rotationSlider').value = 0;
    document.getElementById('rotationValue').textContent = '0';
  };

  window.changeRotation = function(val) {
    document.getElementById('rotationValue').textContent = val;
    var obj = canvas.getActiveObject();
    إذا كان الكائن موجودًا، فسيتم تعيين زاوية الكائن باستخدام الدالة `parseInt(val)`، ثم يتم عرض جميع عناصر اللوحة.
  };
  window.changeOpacity = function(val) {
    document.getElementById('opacityValue').textContent = val;
    var obj = canvas.getActiveObject();
    إذا كان الكائن موجودًا، فقم بتعيين شفافيته إلى 100، ثم قم بعرض جميع عناصر اللوحة.
  };
  window.changeTextColor = function(color) {
    var obj = canvas.getActiveObject();
    إذا كان الكائن موجودًا، فقم بتعيين لون التعبئة له، ثم قم بعرض جميع عناصر اللوحة.
  };

  // سحّاب تحديث المتحكمات
  canvas.on('selection:created', updateControls);
  canvas.on('selection:updated', updateControls);
  canvas.on('object:modified', updateControls);

  دالة تحديث عناصر التحكم() {
    var obj = canvas.getActiveObject();
    إذا لم يكن الكائن موجودًا، فقم بالخروج.
    
    document.getElementById('opacitySlider').value = (obj.opacity || 1) * 100;
    document.getElementById('opacityValue').textContent = Math.round((obj.opacity || 1) * 100);
    
    var angle = Math.round(obj.angle || 0);
    document.getElementById('rotationSlider').value = angle;
    document.getElementById('rotationValue').textContent = angle;
    
    إذا كان (obj.fill && typeof obj.fill === 'string' && obj.fill.startsWith('#')) {
      document.getElementById('textColorPicker').value = obj.fill;
      document.getElementById('newTextColor').value = obj.fill;
    }
    إذا كان (obj.fontFamily && (obj.type === 'i-text' || obj.type === 'text')) {
      currentFont = obj.fontFamily;
      buildFontGrid(document.getElementById('fontSearch').value);
    }
    إذا كان حجم الخط موجودًا (obj.fontSize) {
      document.getElementById('fontSizeSlider').value = obj.fontSize;
      document.getElementById('fontSizeValue').textContent = obj.fontSize;
    }
  }

  canvas.on('object:rotating', function() {
    var obj = canvas.getActiveObject();
    إذا لم يكن الكائن موجودًا، فقم بالخروج.
    var angle = Math.round(obj.angle || 0);
    document.getElementById('rotationSlider').value = angle;
    document.getElementById('rotationValue').textContent = angle;
  });

  // محو الأمية الفلاتر محو الأمية
  window.applyFilter = function(type) {
    var obj = canvas.getActiveObject();
    if (!obj || obj.type !== 'image') { تنبيه('اختر صورة الجمعة'); يعود؛ }
    obj.filters = [];
    إذا كان (النوع === 'ساطِئ') obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.3 }));
    وإلا إذا كان (النوع === 'التباين') obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.3 }));
    وإلا إذا كان (النوع === 'تشبع') obj.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.5 }));
    وإلا إذا كان (النوع === 'تدرج الرمادي') obj.filters.push(new fabric.Image.filters.Grayscale());
    وإلا إذا كان (النوع === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
    وإلا إذا كان (النوع === 'blur') obj.filters.push(new fabric.Image.filters.Blur({ blur: 0.3 }));
    وإلا إذا كان (النوع === 'عتيق') {
      obj.filters.push(new fabric.Image.filters.Sepia());
      obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.2 }));
    }
    وإلا إذا كان (النوع === 'دافئ') {
      obj.filters.push(new fabric.Image.filters.BlendColor({ color: '#ff9900', mode: 'tint', alpha: 0.2 }));
      obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.1 }));
    }
    obj.applyFilters();
    canvas.renderAll();
  };

  // للتواصل ماسنجر
  var isDrawing = false;
  window.toggleDraw = function() {
    isDrawing = !isDrawing;
    var btn = document.getElementById('drawBtn');
    إذا كان (رسمًا) {
      إذا لم يكن (canvas.freeDrawingBrush) canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
      canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value);
      canvas.discardActiveObject();
      canvas.renderAll();
      canvas.isDrawingMode = true;
      btn.innerHTML = 'إيقاف الرسم';
      btn.classList.remove('btn-purple');
      btn.classList.add('btn-red');
    } آخر {
      canvas.isDrawingMode = false;
      btn.innerHTML = 'تفعيل الرسم';
      btn.classList.remove('btn-red');
      btn.classList.add('btn-purple');
    }
  };

  document.getElementById('brushColor').addEventListener('input', function(e) {
    إذا كان (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = e.target.value;
  });
  document.getElementById('brushSize').addEventListener('input', function(e) {
    document.getElementById('brushSizeValue').textContent = e.target.value;
    إذا كان (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(e.target.value);
  });

  // محو الأميةالتنقيح الكل محو الأمية
  window.clearAll = function() {
    if (!confirm('هل تريد مسح كل شيء؟')) return;
    canvas.clear();
    canvas.backgroundColor = '#ffffff';
    canvas.renderAll();
  };

  // للتواصل: تصدير PNG
  window.exportPNG = function() {
    إذا كان (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        المسار: 'editor-تحميل-تصميم'،
        العنوان: 'تحميل تصميم من المحرر',
        الحدث: صحيح
      });
    }
    
    canvas.discardActiveObject();
    canvas.renderAll();
    var dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
    var link = document.createElement('a');
    link.download = 'resha-' + Date.now() + '.png';
    link.href = dataURL;
    link.click();
  };

  // محو الأمية اختصارات محو الأمية
  document.addEventListener('keydown', function(e) {
    إذا كان (مفتاح الحذف هو 'Delete' أو مفتاح المسافة للخلف هو 'Backspace') وكان canvas.getActiveObject() {
      إذا كان اسم العنصر النشط في المستند لا يساوي 'INPUT' ولا 'TEXTAREA'،
        حذف العنصر المحدد();
      }
    }
  });

  console.log('✅ جاهزية جاهزة — مع إصلاح مشكلة التحريك');
});
</script>
