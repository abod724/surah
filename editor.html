<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ريشة — المحرر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700;800&family=Mada:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Readex+Pro:wght@400;700&family=Alexandria:wght@400;700;900&family=Rubik:wght@400;700&family=Changa:wght@400;700&family=Lemonada:wght@400;700&family=El+Messiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Kufam:wght@400;700&family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Lateef&family=Harmattan&family=Markazi+Text:wght@400;700&family=Mirza:wght@400;700&family=Gulzar&family=Aref+Ruqaa:wght@400;700&family=Alkalami&family=Katibeh&family=Qahiri&family=Rakkas&family=Lalezar&family=Jomhuria&family=Marhey:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700&family=Saira:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-light: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  /* ═══ Header ═══ */
  .header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(99,102,241,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
  }
  .header-logo-icon {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    backdrop-filter: blur(10px);
  }
  .header-logo-text {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.3px;
  }
  .header-logo-sub {
    font-size: 10px;
    opacity: 0.85;
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .header-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .header-btn:active {
    transform: scale(0.95);
    background: rgba(255,255,255,0.25);
  }
  
  /* ═══ Container ═══ */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
  }
  
  /* ═══ Canvas Area ═══ */
  .canvas-wrapper {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 300px;
    background-image: 
      linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
      linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  #c {
    border-radius: var(--radius-sm);
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    max-width: 100%;
    max-height: 55vh;
    touch-action: none;
    display: block;
    background: #fff;
  }
  .canvas-container .upper-canvas { touch-action: none !important; }
  
  /* ═══ Tabs Bar ═══ */
  .tabs-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 0 12px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  
  .tab-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text-light);
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .tab-btn:active { transform: scale(0.96); }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(99,102,241,0.35);
  }
  
  /* ═══ Tab Panels ═══ */
  .tab-panels {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .panel {
    display: none;
    padding: 20px;
  }
  .panel.active {
    display: block;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* ═══ Panel Title ═══ */
  .panel-title {
    font-size: 14px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    width: 4px;
    height: 16px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-radius: 2px;
  }
  
  /* ═══ Inputs ═══ */
  textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    resize: vertical;
    min-height: 70px;
    max-height: 200px;
    transition: all 0.2s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  
  input[type="color"] {
    width: 100%;
    height: 44px;
    padding: 3px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: #fff;
    transition: border-color 0.2s;
  }
  input[type="color"]:focus { border-color: var(--primary); }
  
  input[type="text"], select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    background: #fff;
    color: var(--text);
    transition: all 0.2s;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    cursor: pointer;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(99,102,241,0.4);
  }
  
  /* ═══ Labels ═══ */
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-weight: 700;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }
  .field-value {
    font-weight: 900;
    color: var(--primary);
    font-size: 14px;
  }
  
  /* ═══ Buttons ═══ */
  .btn-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .btn {
    padding: 13px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-primary { background: linear-gradient(135deg, var(--primary), #8b5cf6); }
  .btn-primary:hover { box-shadow: 0 6px 16px rgba(99,102,241,0.4); }
  .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
  .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .btn-gray { background: linear-gradient(135deg, #64748b, #475569); }
  .btn-light {
    background: var(--card);
    color: var(--text);
    border: 2px solid var(--border);
  }
  .btn-light:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }
  
  /* ═══ Color Grid ═══ */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.active {
    border-color: var(--text);
    transform: scale(1.05);
  }
  
  /* ═══ Font Grid ═══ */
  .font-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
    padding: 4px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
  }
  .font-btn {
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .font-btn:active { transform: scale(0.98); }
  .font-btn.active {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 2px 8px rgba(99,102,241,0.15);
  }
  .font-preview {
    font-size: 18px;
    color: var(--text);
    flex: 1;
  }
  .font-name {
    font-size: 10px;
    color: var(--text-light);
    font-weight: 700;
    direction: ltr;
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .font-btn.active .font-name {
    background: #fff;
    color: var(--primary);
  }
  
  /* ═══ Divider ═══ */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }
  
  /* ═══ Footer ═══ */
  .footer {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-light);
    font-size: 12px;
  }
  .footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
  }
  
  /* ═══ Responsive ═══ */
  @media (min-width: 900px) {
    .editor-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .canvas-wrapper { position: sticky; top: 90px; }
  }
  @media (max-width: 600px) {
    .container { padding: 10px; }
    .header { padding: 12px 14px; }
    .header-logo-text { font-size: 16px; }
    .header-logo-icon { width: 36px; height: 36px; font-size: 18px; }
    .panel { padding: 14px; }
    .tab-btn { padding: 9px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="header-logo">
    <div class="header-logo-icon">🖌️</div>
    <div>
      <div class="header-logo-text">ريشة</div>
      <div class="header-logo-sub">المحرر المتقدم</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="exportPNG()" title="تحميل">⬇</button>
  </div>
</div>

<!-- ═══ Main Container ═══ -->
<div class="container">
  <div class="editor-layout">
    
    <!-- ═══ Canvas ═══ -->
    <div class="canvas-wrapper">
      <canvas id="c" width="1080" height="1080"></canvas>
    </div>

    <!-- ═══ Tools ═══ -->
    <div>
      
      <!-- Tabs Bar -->
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="toggleTab('text', this)">📝 النص</button>
        <button class="tab-btn" onclick="toggleTab('image', this)">🖼️ الصور</button>
        <button class="tab-btn" onclick="toggleTab('shape', this)">🔷 الأشكال</button>
        <button class="tab-btn" onclick="toggleTab('edit', this)">⚙️ تعديل</button>
        <button class="tab-btn" onclick="toggleTab('draw', this)">✏️ رسم</button>
        <button class="tab-btn" onclick="toggleTab('filter', this)">🎨 فلاتر</button>
      </div>
      
      <!-- Panels -->
      <div class="tab-panels">

        <!-- ═══ النص ═══ -->
        <div id="panel-text" class="panel active">
          <div class="panel-title">النص</div>
          
          <div class="field">
            <textarea id="textInput" rows="2" placeholder="اكتب النص هنا...">اترك أثراً جميلاً</textarea>
          </div>

          <div class="field">
            <label>حجم الخط: <span class="field-value" id="fontSizeValue">80</span></label>
            <input type="range" id="fontSizeSlider" min="20" max="200" value="80">
          </div>

          <div class="field">
            <label>لون النص</label>
            <input type="color" id="newTextColor" value="#000000">
            <div class="color-grid" id="quickColors"></div>
          </div>

          <div class="btn-col">
            <button class="btn btn-primary" onclick="addText()">إضافة نص</button>
          </div>

          <div class="divider"></div>

          <div class="field">
            <label>اختر الخط</label>
            <input type="text" id="fontSearch" placeholder="ابحث عن خط..." style="margin-bottom:8px;">
            <div class="font-grid" id="fontGrid"></div>
          </div>
        </div>

        <!-- ═══ الصور ═══ -->
        <div id="panel-image" class="panel">
          <div class="panel-title">الصور</div>
          <div class="btn-col">
            <button class="btn btn-green" onclick="document.getElementById('imgLoader').click()">رفع صورة</button>
            <input type="file" id="imgLoader" accept="image/*" style="display:none;" onchange="addImage(event)">
          </div>
        </div>

        <!-- ═══ الأشكال ═══ -->
        <div id="panel-shape" class="panel">
          <div class="panel-title">الأشكال</div>
          <div class="btn-row">
            <button class="btn btn-light" onclick="addShape('rect')">مستطيل</button>
            <button class="btn btn-light" onclick="addShape('circle')">دائرة</button>
            <button class="btn btn-light" onclick="addShape('triangle')">مثلث</button>
            <button class="btn btn-light" onclick="addShape('line')">خط</button>
          </div>
          <div class="field" style="margin-top:16px;">
            <label>لون الشكل</label>
            <input type="color" id="shapeColor" value="#6366f1">
          </div>
        </div>

        <!-- ═══ تعديل ═══ -->
        <div id="panel-edit" class="panel">
          <div class="panel-title">تعديل</div>
          <div class="btn-row">
            <button class="btn btn-orange" onclick="bringForward()">للأمام</button>
            <button class="btn btn-orange" onclick="sendBackward()">للخلف</button>
            <button class="btn btn-purple" onclick="duplicateSelected()">تكرار</button>
            <button class="btn btn-red" onclick="deleteSelected()">حذف</button>
          </div>
          <div class="field" style="margin-top:16px;">
            <label>شفافية: <span class="field-value" id="opacityValue">100</span>%</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="changeOpacity(this.value)">
          </div>
          <div class="field">
            <label>لون العنصر المحدد</label>
            <input type="color" id="textColorPicker" value="#000000" oninput="changeTextColor(this.value)">
          </div>
        </div>

        <!-- ═══ رسم ═══ -->
        <div id="panel-draw" class="panel">
          <div class="panel-title">الرسم</div>
          <div class="btn-col">
            <button class="btn btn-purple" onclick="toggleDraw()" id="drawBtn">تفعيل الرسم</button>
            <button class="btn btn-gray" onclick="clearAll()">مسح الكل</button>
          </div>
          <div class="field" style="margin-top:16px;">
            <label>لون القلم</label>
            <input type="color" id="brushColor" value="#000000">
            <div class="color-grid" id="brushColors"></div>
          </div>
          <div class="field">
            <label>حجم الفرشاة: <span class="field-value" id="brushSizeValue">20</span></label>
            <input type="range" id="brushSize" min="1" max="80" value="20">
          </div>
        </div>

        <!-- ═══ فلاتر ═══ -->
        <div id="panel-filter" class="panel">
          <div class="panel-title">الفلاتر</div>
          <div class="btn-col">
            <button class="btn btn-light" onclick="applyFilter('none')">بدون</button>
            <button class="btn btn-light" onclick="applyFilter('bright')">إضاءة</button>
            <button class="btn btn-light" onclick="applyFilter('contrast')">تباين</button>
            <button class="btn btn-light" onclick="applyFilter('saturate')">تشبع</button>
            <button class="btn btn-light" onclick="applyFilter('grayscale')">رمادي</button>
            <button class="btn btn-light" onclick="applyFilter('sepia')">قديم</button>
            <button class="btn btn-light" onclick="applyFilter('blur')">ضبابي</button>
            <button class="btn btn-light" onclick="applyFilter('vintage')">فينتاج</button>
            <button class="btn btn-light" onclick="applyFilter('warm')">دافئ</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- ═══ Footer ═══ -->
  <div class="footer">
    <a href="index.html">العودة إلى ريشة</a>
  </div>
</div>

<script>
window.addEventListener('load', function() {
  var canvas = new fabric.Canvas('c', {
    backgroundColor: '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    allowTouchScrolling: false,
    enableRetinaScaling: true,
    width: 1080,
    height: 1080
  });

  // إعدادات الكائنات
  fabric.Object.prototype.set({
    transparentCorners: false,
    cornerColor: '#6366f1',
    cornerStrokeColor: '#fff',
    borderColor: '#6366f1',
    cornerSize: 24,
    touchCornerSize: 36,
    padding: 10,
    cornerStyle: 'circle',
    borderScaleFactor: 2,
    hasControls: true,
    hasBorders: true,
    lockScalingFlip: true,
    lockUniScaling: false,
    centeredScaling: false,
    rotatingPointOffset: 40,
    mtrCornerColor: '#f59e0b',
    mtrCornerStrokeColor: '#fff',
    borderOpacityWhenMoving: 0.8
  });

  fabric.Object.prototype.setControlsVisibility({
    mt: true, mb: true, ml: true, mr: true,
    tl: true, tr: true, bl: true, br: true,
    mtr: true
  });

  // تغيير حجم الكانفس
  function resizeCanvas() {
    var wrapper = document.querySelector('.canvas-wrapper');
    var maxWidth = wrapper.clientWidth - 32;
    var maxHeight = window.innerHeight * 0.55;
    var scale = Math.min(maxWidth / 1080, maxHeight / 1080);
    canvas.setDimensions({ 
      width: 1080 * scale, 
      height: 1080 * scale 
    });
    canvas.setZoom(scale);
    canvas.renderAll();
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function() { setTimeout(resizeCanvas, 300); });
  setTimeout(resizeCanvas, 100);

  // ═══ الألوان السريعة ═══
  var QUICK_COLORS = [
    '#000000', '#ffffff', '#dc2626', '#ea580c', '#f59e0b', '#facc15', '#84cc16', '#16a34a',
    '#10b981', '#14b8a6', '#0891b2', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7',
    '#d946ef', '#ec4899', '#f43f5e', '#78350f', '#1e293b', '#334155', '#64748b', '#94a3b8'
  ];

  var quickColorsEl = document.getElementById('quickColors');
  QUICK_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.onclick = function() {
      document.getElementById('newTextColor').value = c;
      quickColorsEl.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
      sw.classList.add('active');
      var obj = canvas.getActiveObject();
      if (obj) { obj.set('fill', c); canvas.renderAll(); }
    };
    quickColorsEl.appendChild(sw);
  });

  var brushColorsEl = document.getElementById('brushColors');
  QUICK_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.onclick = function() {
      document.getElementById('brushColor').value = c;
      brushColorsEl.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
      sw.classList.add('active');
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = c;
    };
    brushColorsEl.appendChild(sw);
  });

  // ═══════════════════════════════════════════════
  // ✅ قائمة الخطوط — كل خط مع اسمه ووصفه
  // ═══════════════════════════════════════════════
  var FONT_LIST = [
    { name: 'Cairo', label: 'حديث' },
    { name: 'Tajawal', label: 'أنيق' },
    { name: 'Almarai', label: 'نظيف' },
    { name: 'Mada', label: 'بسيط' },
    { name: 'IBM Plex Sans Arabic', label: 'احترافي' },
    { name: 'Noto Sans Arabic', label: 'عام' },
    { name: 'Readex Pro', label: 'عصري' },
    { name: 'Alexandria', label: 'واضح' },
    { name: 'Rubik', label: 'هندسي' },
    { name: 'Changa', label: 'مبتكر' },
    { name: 'Lemonada', label: 'رقيق' },
    { name: 'El Messiri', label: 'راقي' },
    { name: 'Reem Kufi', label: 'كوفي' },
    { name: 'Noto Kufi Arabic', label: 'كوفي' },
    { name: 'Kufam', label: 'كوفي حديث' },
    { name: 'Amiri', label: 'كلاسيكي' },
    { name: 'Amiri Quran', label: 'قرآني' },
    { name: 'Scheherazade New', label: 'تقليدي' },
    { name: 'Noto Naskh Arabic', label: 'نسخ' },
    { name: 'Lateef', label: 'قرآني' },
    { name: 'Harmattan', label: 'بسيط' },
    { name: 'Markazi Text', label: 'مشرقي' },
    { name: 'Mirza', label: 'فارسي' },
    { name: 'Gulzar', label: 'نستعليق' },
    { name: 'Aref Ruqaa', label: 'رقعة' },
    { name: 'Alkalami', label: 'رقعة حديثة' },
    { name: 'Katibeh', label: 'كاتب' },
    { name: 'Qahiri', label: 'قاهري' },
    { name: 'Rakkas', label: 'ديكوري' },
    { name: 'Lalezar', label: 'عريض' },
    { name: 'Jomhuria', label: 'عنوان' },
    { name: 'Marhey', label: 'مرح' },
    { name: 'Baloo Bhaijaan 2', label: 'طفولي' },
    { name: 'Saira', label: 'تقني' }
  ];

  var currentFont = 'Cairo';

  // ✅ بناء شبكة الخطوط — كل خط يعرض اسمه بخطه
  function buildFontGrid(filter) {
    var grid = document.getElementById('fontGrid');
    grid.innerHTML = '';
    
    var filtered = FONT_LIST.filter(function(font) {
      if (!filter) return true;
      var term = filter.toLowerCase();
      return font.name.toLowerCase().indexOf(term) !== -1 || 
             font.label.indexOf(filter) !== -1;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px; font-weight:700;">لا توجد نتائج</p>';
      return;
    }

    filtered.forEach(function(font) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'font-btn' + (font.name === currentFont ? ' active' : '');
      
      // ✅ كل خط يعرض: اسم الخط — الوصف
      var sample = font.name + ' — ' + font.label;
      
      btn.innerHTML = 
        '<span class="font-preview" style="font-family: \'' + font.name + '\', Cairo; font-size: 18px;">' + sample + '</span>' +
        '<span class="font-name">' + font.name + '</span>';

      btn.onclick = function() {
        currentFont = font.name;
        
        var applyNow = function() {
          var obj = canvas.getActiveObject();
          if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
            obj.set('fontFamily', font.name);
            canvas.renderAll();
          }
          buildFontGrid(document.getElementById('fontSearch').value);
        };
        
        // ✅ حمّل الخط أولاً ثم طبّقه
        if (document.fonts && document.fonts.load) {
          document.fonts.load('20px "' + font.name + '"', sample).then(applyNow).catch(applyNow);
        } else {
          applyNow();
        }
      };
      
      grid.appendChild(btn);
    });
  }

  document.getElementById('fontSearch').addEventListener('input', function(e) {
    buildFontGrid(e.target.value);
  });
  buildFontGrid('');

  // ═══ تطبيق إعدادات النص ═══
  function applyTextSettings() {
    var obj = canvas.getActiveObject();
    if (!obj) return;
    var color = document.getElementById('newTextColor').value;
    var size = parseInt(document.getElementById('fontSizeSlider').value);
    obj.set({ fill: color, fontSize: size });
    canvas.renderAll();
  }

  document.getElementById('fontSizeSlider').addEventListener('input', function(e) {
    document.getElementById('fontSizeValue').textContent = e.target.value;
    applyTextSettings();
  });

  document.getElementById('newTextColor').addEventListener('input', function(e) {
    var obj = canvas.getActiveObject();
    if (obj) { obj.set('fill', e.target.value); canvas.renderAll(); }
  });

  // ═══ التبويبات ═══
  window.toggleTab = function(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
  };

  // ═══ إضافة نص ═══
  window.addText = function() {
    var text = document.getElementById('textInput').value.trim();
    if (!text) { alert('اكتب نصاً أولاً'); return; }
    
    var color = document.getElementById('newTextColor').value;
    var size = parseInt(document.getElementById('fontSizeSlider').value);
    var fontName = currentFont;
    
    var doAdd = function() {
      var t = new fabric.IText(text, {
        left: 540, top: 540,
        fontFamily: fontName,
        fontSize: size,
        fill: color,
        direction: 'rtl',
        textAlign: 'center',
        originX: 'center', originY: 'center',
        padding: 15,
        editable: true,
        hasControls: true,
        hasBorders: true,
        lockUniScaling: false
      });
      canvas.add(t);
      canvas.setActiveObject(t);
      canvas.renderAll();
    };
    
    if (document.fonts && document.fonts.load) {
      document.fonts.load('20px "' + fontName + '"', text).then(doAdd).catch(doAdd);
    } else {
      doAdd();
    }
  };

  // ═══ إضافة صورة ═══
  window.addImage = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      fabric.Image.fromURL(ev.target.result, function(img) {
        var maxW = 540;
        if (img.width > maxW) img.scaleToWidth(maxW);
        img.set({ left: 540, top: 540, originX: 'center', originY: 'center', padding: 15, filters: [] });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.renderAll();
      });
      e.target.value = '';
    };
    reader.readAsDataURL(file);
  };

  // ═══ إضافة أشكال ═══
  window.addShape = function(type) {
    var color = document.getElementById('shapeColor').value;
    var shape;
    var center = { left: 540, top: 540, originX: 'center', originY: 'center', fill: color, padding: 15 };
    if (type === 'rect') shape = new fabric.Rect({ ...center, width: 360, height: 270 });
    else if (type === 'circle') shape = new fabric.Circle({ ...center, radius: 180 });
    else if (type === 'triangle') shape = new fabric.Triangle({ ...center, width: 360, height: 320 });
    else if (type === 'line') shape = new fabric.Line([200, 0, 880, 0], { left: 540, top: 540, stroke: color, strokeWidth: 12, originX: 'center', originY: 'center', padding: 15 });
    canvas.add(shape);
    canvas.setActiveObject(shape);
    canvas.renderAll();
  };

  // ═══ أدوات التعديل ═══
  window.bringForward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    canvas.bringForward(obj); canvas.renderAll();
  };
  window.sendBackward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    canvas.sendBackwards(obj); canvas.renderAll();
  };
  window.duplicateSelected = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    obj.clone(function(cloned) {
      cloned.set({ left: cloned.left + 30, top: cloned.top + 30 });
      canvas.add(cloned); canvas.setActiveObject(cloned); canvas.renderAll();
    });
  };
  window.deleteSelected = function() {
    var objs = canvas.getActiveObjects();
    if (objs.length === 0) { alert('اختر عنصراً أولاً'); return; }
    objs.forEach(function(o) { canvas.remove(o); });
    canvas.discardActiveObject(); canvas.renderAll();
  };
  window.changeOpacity = function(val) {
    document.getElementById('opacityValue').textContent = val;
    var obj = canvas.getActiveObject();
    if (obj) { obj.set('opacity', val / 100); canvas.renderAll(); }
  };
  window.changeTextColor = function(color) {
    var obj = canvas.getActiveObject();
    if (obj) { obj.set('fill', color); canvas.renderAll(); }
  };

  // ═══ تحديث المتحكمات ═══
  canvas.on('selection:created', updateControls);
  canvas.on('selection:updated', updateControls);
  function updateControls() {
    var obj = canvas.getActiveObject();
    if (!obj) return;
    document.getElementById('opacitySlider').value = (obj.opacity || 1) * 100;
    document.getElementById('opacityValue').textContent = Math.round((obj.opacity || 1) * 100);
    if (obj.fill && typeof obj.fill === 'string' && obj.fill.startsWith('#')) {
      document.getElementById('textColorPicker').value = obj.fill;
      document.getElementById('newTextColor').value = obj.fill;
    }
    if (obj.fontFamily && (obj.type === 'i-text' || obj.type === 'text')) {
      currentFont = obj.fontFamily;
      buildFontGrid(document.getElementById('fontSearch').value);
    }
    if (obj.fontSize) {
      document.getElementById('fontSizeSlider').value = obj.fontSize;
      document.getElementById('fontSizeValue').textContent = obj.fontSize;
    }
  }

  // ═══ الفلاتر ═══
  window.applyFilter = function(type) {
    var obj = canvas.getActiveObject();
    if (!obj || obj.type !== 'image') { alert('اختر صورة أولاً'); return; }
    obj.filters = [];
    if (type === 'bright') obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.3 }));
    else if (type === 'contrast') obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.3 }));
    else if (type === 'saturate') obj.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.5 }));
    else if (type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
    else if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
    else if (type === 'blur') obj.filters.push(new fabric.Image.filters.Blur({ blur: 0.3 }));
    else if (type === 'vintage') {
      obj.filters.push(new fabric.Image.filters.Sepia());
      obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.2 }));
    }
    else if (type === 'warm') {
      obj.filters.push(new fabric.Image.filters.BlendColor({ color: '#ff9900', mode: 'tint', alpha: 0.2 }));
      obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.1 }));
    }
    obj.applyFilters();
    canvas.renderAll();
  };

  // ═══ الرسم ═══
  var isDrawing = false;
  window.toggleDraw = function() {
    isDrawing = !isDrawing;
    var btn = document.getElementById('drawBtn');
    if (isDrawing) {
      if (!canvas.freeDrawingBrush) canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
      canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value);
      canvas.discardActiveObject();
      canvas.renderAll();
      canvas.isDrawingMode = true;
      btn.innerHTML = 'إيقاف الرسم';
      btn.classList.remove('btn-purple');
      btn.classList.add('btn-red');
    } else {
      canvas.isDrawingMode = false;
      btn.innerHTML = 'تفعيل الرسم';
      btn.classList.remove('btn-red');
      btn.classList.add('btn-purple');
    }
  };

  document.getElementById('brushColor').addEventListener('input', function(e) {
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = e.target.value;
  });
  document.getElementById('brushSize').addEventListener('input', function(e) {
    document.getElementById('brushSizeValue').textContent = e.target.value;
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(e.target.value);
  });

  // ═══ مسح الكل ═══
  window.clearAll = function() {
    if (!confirm('هل تريد مسح كل شيء؟')) return;
    canvas.clear();
    canvas.backgroundColor = '#ffffff';
    canvas.renderAll();
  };

  // ═══ تصدير PNG ═══
  window.exportPNG = function() {
    canvas.discardActiveObject();
    canvas.renderAll();
    var dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
    var link = document.createElement('a');
    link.download = 'resha-' + Date.now() + '.png';
    link.href = dataURL;
    link.click();
  };

  // ═══ اختصارات ═══
  document.addEventListener('keydown', function(e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && canvas.getActiveObject()) {
      if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        deleteSelected();
      }
    }
  });
});
</script>

</body>
