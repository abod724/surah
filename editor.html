<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ ريشة — المحرر المتقدم</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=El+Messiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Mada:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px; margin: 0; overflow-x: hidden; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { text-align: center; color: #fff; margin-bottom: 10px; }
  .header h1 { font-size: 17px; margin: 0 0 3px; }
  .header p { font-size: 11px; opacity: 0.9; margin: 0; }
  .editor-wrap { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 1024px) { .editor-wrap { grid-template-columns: 1.5fr 1fr; } .canvas-area { position: sticky; top: 16px; } }
  .card { background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
  
  .canvas-area { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #f1f5f9; 
    border-radius: 14px; 
    padding: 10px; 
    overflow: hidden; 
    min-height: 250px;
  }
  #c { 
    border-radius: 10px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
    max-width: 100%; 
    max-height: 50vh;
    width: auto;
    height: auto;
    touch-action: none; 
    display: block;
  }
  /* ✅ إصلاح الرسم على الجوال */
  .canvas-container .upper-canvas { touch-action: none !important; }
  
  .tools { display: flex; flex-direction: column; gap: 8px; }
  .tabs-bar { display: flex; flex-direction: column; gap: 6px; }
  
  .tab-item { 
    padding: 12px 14px; 
    border-radius: 10px; 
    border: 2px solid #e5e7eb; 
    background: #fff; 
    color: #374151; 
    font-family: 'Cairo', sans-serif; 
    font-weight: 800; 
    font-size: 13px; 
    cursor: pointer; 
    transition: all 0.2s; 
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tab-item::after {
    content: '◀';
    font-size: 10px;
    color: #9ca3af;
    transition: transform 0.2s;
  }
  .tab-item.active { 
    background: linear-gradient(135deg, #667eea, #764ba2); 
    color: #fff; 
    border-color: #667eea; 
  }
  .tab-item.active::after {
    color: #fff;
    transform: rotate(90deg);
  }

  .tab-panel { display: none; padding: 12px; background: #f8fafc; border-radius: 12px; border: 2px solid #e5e7eb; margin-top: 6px; }
  .tab-panel.active { display: block; }

  .btn-col { display: flex; flex-direction: column; gap: 8px; }
  .btn-col .btn { width: 100%; }

  .btn { padding: 12px 16px; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 14px; cursor: pointer; color: #fff; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; }
  .btn-green { background: #10b981; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #ef4444; }
  .btn-orange { background: #f59e0b; }
  .btn-gray { background: #64748b; }
  .btn-filter { background: #fff; color: #374151; border: 2px solid #e5e7eb; padding: 10px; font-size: 13px; width: 100%; border-radius: 12px; font-family: 'Cairo', sans-serif; font-weight: 800; cursor: pointer; transition: all 0.2s; }
  .btn-filter:hover, .btn-filter.active { background: #eef2ff; border-color: #667eea; color: #4338ca; }

  /* ✅ شبكة الألوان السريعة */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    margin-top: 6px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 7px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.active { border-color: #111; }

  textarea { 
    width: 100%; 
    padding: 10px; 
    border: 2px solid #e5e7eb; 
    border-radius: 10px; 
    font-family: 'Cairo', sans-serif; 
    font-size: 14px; 
    background: #fff;
    resize: vertical;
    min-height: 60px;
    max-height: 200px;
  }
  textarea:focus { outline: none; border-color: #667eea; }
  
  input[type="color"] { width: 100%; height: 42px; padding: 2px; border: 2px solid #e5e7eb; border-radius: 10px; cursor: pointer; background: #fff; }
  select { width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; background: #fff; }
  select:focus { outline: none; border-color: #667eea; }
  input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; border-radius: 4px; background: #e5e7eb; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #667eea; cursor: pointer; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .field { margin-bottom: 10px; }
  label { display: block; font-weight: 700; font-size: 12px; color: #374151; margin-bottom: 4px; }
  .footer { text-align: center; color: #fff; font-size: 11px; padding: 12px; margin-top: 10px; }
  .footer a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 8px; font-weight: 700; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>✨ ريشة — المحرر المتقدم</h1>
    <p>اسحب، أفلت، كبّر، دوّر، وامسح كما تشاء</p>
  </div>

  <div class="editor-wrap">
    <div class="card canvas-area">
      <canvas id="c" width="1080" height="1080"></canvas>
    </div>

    <div class="card tools">
      <div class="tabs-bar">

        <!-- ═══ النص ═══ -->
        <button class="tab-item active" onclick="toggleTab('text', this)">📝 النص</button>
        <div id="panel-text" class="tab-panel active">
          <div class="field">
            <textarea id="textInput" rows="2" placeholder="اكتب النص هنا...">اترك أثراً جميلاً</textarea>
          </div>

          <div class="field">
            <label>الخط</label>
            <select id="fontSelect">
              <option value="Cairo">Cairo — حديث</option>
              <option value="Amiri">Amiri — كلاسيكي</option>
              <option value="Tajawal">Tajawal — أنيق</option>
              <option value="Almarai">Almarai — نظيف</option>
              <option value="El Messiri">El Messiri — أنيق</option>
              <option value="Reem Kufi">Reem Kufi — كوفي</option>
              <option value="Scheherazade New">Scheherazade — تقليدي</option>
              <option value="Noto Naskh Arabic">Noto Naskh — نسخ</option>
              <option value="Mada">Mada — حديث</option>
            </select>
          </div>

          <div class="field">
            <label>لون النص</label>
            <input type="color" id="newTextColor" value="#000000">
            <div class="color-grid" id="quickColors"></div>
          </div>

          <div class="field">
            <label>حجم الخط: <span id="fontSizeValue">80</span></label>
            <input type="range" id="fontSizeSlider" min="20" max="200" value="80">
          </div>

          <div class="btn-col">
            <button class="btn btn-primary" onclick="addText()">➕ إضافة نص</button>
          </div>
        </div>

        <!-- ═══ الصور ═══ -->
        <button class="tab-item" onclick="toggleTab('image', this)">🖼️ الصور</button>
        <div id="panel-image" class="tab-panel">
          <div class="btn-col">
            <button class="btn btn-green" onclick="document.getElementById('imgLoader').click()">➕ إضافة صورة</button>
            <input type="file" id="imgLoader" accept="image/*" style="display:none;" onchange="addImage(event)">
          </div>
        </div>

        <!-- ═══ الأشكال ═══ -->
        <button class="tab-item" onclick="toggleTab('shape', this)">🔷 الأشكال</button>
        <div id="panel-shape" class="tab-panel">
          <div class="btn-col">
            <button class="btn btn-gray" onclick="addShape('rect')">▭ مستطيل</button>
            <button class="btn btn-gray" onclick="addShape('circle')">◯ دائرة</button>
            <button class="btn btn-gray" onclick="addShape('triangle')">△ مثلث</button>
            <button class="btn btn-gray" onclick="addShape('line')">― خط</button>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>لون الشكل</label>
            <input type="color" id="shapeColor" value="#667eea">
          </div>
        </div>

        <!-- ═══ تعديل ═══ -->
        <button class="tab-item" onclick="toggleTab('edit', this)">⚙️ تعديل</button>
        <div id="panel-edit" class="tab-panel">
          <div class="btn-col">
            <button class="btn btn-orange" onclick="bringForward()">⬆️ للأمام</button>
            <button class="btn btn-orange" onclick="sendBackward()">⬇️ للخلف</button>
            <button class="btn btn-purple" onclick="duplicateSelected()">📋 تكرار</button>
            <button class="btn btn-red" onclick="deleteSelected()">🗑️ حذف</button>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>شفافية العنصر: <span id="opacityValue">100</span>%</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="changeOpacity(this.value)">
          </div>
          <div class="field">
            <label>لون العنصر المحدد</label>
            <input type="color" id="textColorPicker" value="#000000" oninput="changeTextColor(this.value)">
          </div>
        </div>

        <!-- ═══ فلاتر ═══ -->
        <button class="tab-item" onclick="toggleTab('filter', this)">🎨 فلاتر</button>
        <div id="panel-filter" class="tab-panel">
          <div class="btn-col">
            <button class="btn-filter" onclick="applyFilter('none')">بدون</button>
            <button class="btn-filter" onclick="applyFilter('bright')">☀️ إضاءة</button>
            <button class="btn-filter" onclick="applyFilter('contrast')">◐ تباين</button>
            <button class="btn-filter" onclick="applyFilter('saturate')">🌈 تشبع</button>
            <button class="btn-filter" onclick="applyFilter('grayscale')">⚫ رمادي</button>
            <button class="btn-filter" onclick="applyFilter('sepia')">📜 قديم</button>
            <button class="btn-filter" onclick="applyFilter('blur')">💨 ضبابي</button>
            <button class="btn-filter" onclick="applyFilter('vintage')">🎞️ فينتاج</button>
            <button class="btn-filter" onclick="applyFilter('warm')">🔥 دافئ</button>
          </div>
        </div>

        <!-- ═══ رسم ═══ -->
        <button class="tab-item" onclick="toggleTab('draw', this)">🖌️ رسم</button>
        <div id="panel-draw" class="tab-panel">
          <div class="btn-col">
            <button class="btn btn-purple" onclick="toggleDraw()" id="drawBtn">✏️ تفعيل الرسم</button>
            <button class="btn btn-gray" onclick="clearAll()">🧹 مسح الكل</button>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>لون القلم</label>
            <input type="color" id="brushColor" value="#000000">
            <div class="color-grid" id="brushColors"></div>
          </div>
          <div class="field">
            <label>حجم الفرشاة: <span id="brushSizeValue">20</span></label>
            <input type="range" id="brushSize" min="1" max="80" value="20">
          </div>
        </div>

        <!-- ═══ تصدير ═══ -->
        <button class="tab-item" onclick="toggleTab('export', this)">💾 تصدير</button>
        <div id="panel-export" class="tab-panel">
          <div class="btn-col">
            <button class="btn btn-primary" onclick="exportPNG()">📥 تحميل PNG</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="footer">
    <a href="index.html">← العودة إلى ريشة</a>
  </div>
</div>

<script>
window.addEventListener('load', function() {
  var canvas = new fabric.Canvas('c', {
    backgroundColor: '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    allowTouchScrolling: false,
    enableRetinaScaling: true,
    width: 1080,
    height: 1080
  });

  // إعدادات الكائنات
  fabric.Object.prototype.set({
    transparentCorners: false,
    cornerColor: '#667eea',
    cornerStrokeColor: '#fff',
    borderColor: '#667eea',
    cornerSize: 28,
    touchCornerSize: 40,
    padding: 10,
    cornerStyle: 'circle',
    borderScaleFactor: 2,
    hasControls: true,
    hasBorders: true,
    lockScalingFlip: true,
    lockUniScaling: false,
    centeredScaling: false
  });

  // ✅ إخفاء مقابض الوسط (منع التدوير الخاطئ) — التدوير من الزوايا فقط
  fabric.Object.prototype.setControlsVisibility({
    mt: false,
    mb: false,
    ml: false,
    mr: false,
    tl: true,
    tr: true,
    bl: true,
    br: true,
    mtr: false
  });

  // دالة تغيير الحجم
  function resizeCanvas() {
    var area = document.querySelector('.canvas-area');
    var maxWidth = area.clientWidth - 20;
    var maxHeight = window.innerHeight * 0.5;
    var scale = Math.min(maxWidth / 1080, maxHeight / 1080);
    canvas.setDimensions({ 
      width: 1080 * scale, 
      height: 1080 * scale 
    });
    canvas.setZoom(scale);
    canvas.renderAll();
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function() { setTimeout(resizeCanvas, 300); });
  setTimeout(resizeCanvas, 100);

  // ═══════════════════════════════════════════════
  // لوحة الألوان السريعة (للنص + للفرشاة)
  // ═══════════════════════════════════════════════
  var QUICK_COLORS = [
    '#000000', '#ffffff', '#dc2626', '#ea580c', '#f59e0b', '#facc15', '#84cc16', '#16a34a',
    '#10b981', '#14b8a6', '#0891b2', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7',
    '#d946ef', '#ec4899', '#f43f5e', '#78350f', '#1e293b', '#334155', '#64748b', '#94a3b8'
  ];

  // ألوان النص
  var quickColorsEl = document.getElementById('quickColors');
  QUICK_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.onclick = function() {
      document.getElementById('newTextColor').value = c;
      quickColorsEl.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
      sw.classList.add('active');
      applyTextSettings();
    };
    quickColorsEl.appendChild(sw);
  });

  // ألوان الفرشاة
  var brushColorsEl = document.getElementById('brushColors');
  QUICK_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.onclick = function() {
      document.getElementById('brushColor').value = c;
      brushColorsEl.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
      sw.classList.add('active');
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = c;
    };
    brushColorsEl.appendChild(sw);
  });

  // ═══════════════════════════════════════════════
  // تحديث إعدادات النص المحدد
  // ═══════════════════════════════════════════════
  function applyTextSettings() {
    var obj = canvas.getActiveObject();
    if (!obj || (obj.type !== 'i-text' && obj.type !== 'text')) return;
    
    var font = document.getElementById('fontSelect').value;
    var color = document.getElementById('newTextColor').value;
    var size = parseInt(document.getElementById('fontSizeSlider').value);
    
    obj.set({ fill: color, fontFamily: font, fontSize: size });
    canvas.renderAll();
  }

  document.getElementById('fontSizeSlider').addEventListener('input', function(e) {
    document.getElementById('fontSizeValue').textContent = e.target.value;
    applyTextSettings();
  });
  document.getElementById('newTextColor').addEventListener('input', applyTextSettings);
  document.getElementById('fontSelect').addEventListener('change', applyTextSettings);

  // ═══════════════════════════════════════════════
  // التبويبات
  // ═══════════════════════════════════════════════
  window.toggleTab = function(name, btn) {
    var panel = document.getElementById('panel-' + name);
    var isActive = btn.classList.contains('active');
    document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    if (!isActive) {
      btn.classList.add('active');
      panel.classList.add('active');
    }
  };

  // ═══════════════════════════════════════════════
  // إضافة نص
  // ═══════════════════════════════════════════════
  window.addText = function() {
    var text = document.getElementById('textInput').value.trim();
    if (!text) { alert('اكتب نصاً أولاً'); return; }
    
    var color = document.getElementById('newTextColor').value;
    var font = document.getElementById('fontSelect').value;
    var size = parseInt(document.getElementById('fontSizeSlider').value);
    
    var t = new fabric.IText(text, {
      left: 540, top: 540,
      fontFamily: font,
      fontSize: size,
      fill: color,
      direction: 'rtl',
      textAlign: 'center',
      originX: 'center', originY: 'center',
      padding: 15,
      editable: true,
      hasControls: true,
      hasBorders: true,
      lockUniScaling: false
    });
    canvas.add(t);
    canvas.setActiveObject(t);
    canvas.renderAll();
  };

  // ═══════════════════════════════════════════════
  // إضافة صورة
  // ═══════════════════════════════════════════════
  window.addImage = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      fabric.Image.fromURL(ev.target.result, function(img) {
        var maxW = 540;
        if (img.width > maxW) img.scaleToWidth(maxW);
        img.set({ left: 540, top: 540, originX: 'center', originY: 'center', padding: 15, filters: [] });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.renderAll();
      });
      e.target.value = '';
    };
    reader.readAsDataURL(file);
  };

  // ═══════════════════════════════════════════════
  // إضافة أشكال
  // ═══════════════════════════════════════════════
  window.addShape = function(type) {
    var color = document.getElementById('shapeColor').value;
    var shape;
    var center = { left: 540, top: 540, originX: 'center', originY: 'center', fill: color, padding: 15 };
    if (type === 'rect') shape = new fabric.Rect({ ...center, width: 360, height: 270 });
    else if (type === 'circle') shape = new fabric.Circle({ ...center, radius: 180 });
    else if (type === 'triangle') shape = new fabric.Triangle({ ...center, width: 360, height: 320 });
    else if (type === 'line') shape = new fabric.Line([200, 0, 880, 0], { left: 540, top: 540, stroke: color, strokeWidth: 12, originX: 'center', originY: 'center', padding: 15 });
    canvas.add(shape);
    canvas.setActiveObject(shape);
    canvas.renderAll();
  };

  // ═══════════════════════════════════════════════
  // أدوات التعديل
  // ═══════════════════════════════════════════════
  window.bringForward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    canvas.bringForward(obj); canvas.renderAll();
  };
  window.sendBackward = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    canvas.sendBackwards(obj); canvas.renderAll();
  };
  window.duplicateSelected = function() {
    var obj = canvas.getActiveObject();
    if (!obj) { alert('اختر عنصراً أولاً'); return; }
    obj.clone(function(cloned) {
      cloned.set({ left: cloned.left + 30, top: cloned.top + 30 });
      canvas.add(cloned); canvas.setActiveObject(cloned); canvas.renderAll();
    });
  };
  window.deleteSelected = function() {
    var objs = canvas.getActiveObjects();
    if (objs.length === 0) { alert('اختر عنصراً أولاً'); return; }
    objs.forEach(function(o) { canvas.remove(o); });
    canvas.discardActiveObject(); canvas.renderAll();
  };
  window.changeOpacity = function(val) {
    document.getElementById('opacityValue').textContent = val;
    var obj = canvas.getActiveObject();
    if (obj) { obj.set('opacity', val / 100); canvas.renderAll(); }
  };
  window.changeTextColor = function(color) {
    var obj = canvas.getActiveObject();
    if (obj) { 
      if (obj.type === 'i-text' || obj.type === 'text') {
        obj.set('fill', color);
      } else {
        obj.set('fill', color);
      }
      canvas.renderAll(); 
    }
  };

  // ═══════════════════════════════════════════════
  // تحديث المتحكمات عند التحديد
  // ═══════════════════════════════════════════════
  canvas.on('selection:created', updateControls);
  canvas.on('selection:updated', updateControls);
  function updateControls() {
    var obj = canvas.getActiveObject();
    if (!obj) return;
    
    document.getElementById('opacitySlider').value = (obj.opacity || 1) * 100;
    document.getElementById('opacityValue').textContent = Math.round((obj.opacity || 1) * 100);
    
    if (obj.fill && typeof obj.fill === 'string' && obj.fill.startsWith('#')) {
      document.getElementById('textColorPicker').value = obj.fill;
    }
    
    if (obj.fontFamily) {
      var sel = document.getElementById('fontSelect');
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === obj.fontFamily) {
          sel.selectedIndex = i;
          break;
        }
      }
    }
    
    if (obj.fontSize) {
      document.getElementById('fontSizeSlider').value = obj.fontSize;
      document.getElementById('fontSizeValue').textContent = obj.fontSize;
    }
  }

  // ═══════════════════════════════════════════════
  // الفلاتر
  // ═══════════════════════════════════════════════
  window.applyFilter = function(type) {
    var obj = canvas.getActiveObject();
    if (!obj || obj.type !== 'image') { alert('اختر صورة أولاً لتطبيق الفلتر'); return; }
    obj.filters = [];
    if (type === 'bright') obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.3 }));
    else if (type === 'contrast') obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.3 }));
    else if (type === 'saturate') obj.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.5 }));
    else if (type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
    else if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
    else if (type === 'blur') obj.filters.push(new fabric.Image.filters.Blur({ blur: 0.3 }));
    else if (type === 'vintage') {
      obj.filters.push(new fabric.Image.filters.Sepia());
      obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.2 }));
    }
    else if (type === 'warm') {
      obj.filters.push(new fabric.Image.filters.BlendColor({ color: '#ff9900', mode: 'tint', alpha: 0.2 }));
      obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.1 }));
    }
    obj.applyFilters(); 
    canvas.renderAll();
  };

  // ═══════════════════════════════════════════════
  // ✅ الرسم — النسخة المُصلَحة
  // ═══════════════════════════════════════════════
  var isDrawing = false;
  
  window.toggleDraw = function() {
    isDrawing = !isDrawing;
    var btn = document.getElementById('drawBtn');
    
    if (isDrawing) {
      // 1. إنشاء الفرشاة أولاً
      if (!canvas.freeDrawingBrush) {
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      }
      canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
      canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value);
      
      // 2. إلغاء التحديد
      canvas.discardActiveObject();
      canvas.renderAll();
      
      // 3. تفعيل الرسم
      canvas.isDrawingMode = true;
      
      btn.innerHTML = '⏹️ إيقاف الرسم';
      btn.classList.remove('btn-purple');
      btn.classList.add('btn-red');
    } else {
      canvas.isDrawingMode = false;
      btn.innerHTML = '✏️ تفعيل الرسم';
      btn.classList.remove('btn-red');
      btn.classList.add('btn-purple');
    }
  };

  document.getElementById('brushColor').addEventListener('input', function(e) {
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = e.target.value;
  });
  document.getElementById('brushSize').addEventListener('input', function(e) {
    document.getElementById('brushSizeValue').textContent = e.target.value;
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(e.target.value);
  });

  // ═══════════════════════════════════════════════
  // مسح الكل
  // ═══════════════════════════════════════════════
  window.clearAll = function() {
    if (!confirm('هل تريد مسح كل شيء؟')) return;
    canvas.clear(); 
    canvas.backgroundColor = '#ffffff'; 
    canvas.renderAll();
  };

  // ═══════════════════════════════════════════════
  // تصدير PNG
  // ═══════════════════════════════════════════════
  window.exportPNG = function() {
    canvas.discardActiveObject(); 
    canvas.renderAll();
    var dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
    var link = document.createElement('a');
    link.download = 'resha-editor-' + Date.now() + '.png';
    link.href = dataURL; 
    link.click();
  };

  // ═══════════════════════════════════════════════
  // اختصارات لوحة المفاتيح
  // ═══════════════════════════════════════════════
  document.addEventListener('keydown', function(e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && canvas.getActiveObject()) {
      if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        deleteSelected();
      }
    }
  });
});
</script>
