<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ ريشة — المحرر المتقدم</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 12px; margin: 0; overflow-x: hidden; }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; color: #fff; margin-bottom: 16px; }
  .header h1 { font-size: 22px; margin: 0 0 4px; }
  .header p { font-size: 13px; opacity: 0.9; margin: 0; }
  .editor-wrap { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1024px) { .editor-wrap { grid-template-columns: 1.6fr 1fr; } .canvas-area { position: sticky; top: 16px; } }
  .card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
  .canvas-area { display: flex; justify-content: center; align-items: center; background: #f1f5f9; border-radius: 16px; padding: 12px; overflow: hidden; min-height: 300px; }
  #c { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 100%; touch-action: none; }
  .tools { display: flex; flex-direction: column; gap: 10px; }

  details.dropdown {
    background: #f8fafc;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  details.dropdown summary {
    padding: 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    color: #374151;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.dropdown summary::-webkit-details-marker { display: none; }
  details.dropdown summary::after {
    content: '▼';
    font-size: 12px;
    color: #6b7280;
    transition: transform 0.2s;
  }
  details.dropdown[open] summary::after { transform: rotate(180deg); }
  details.dropdown[open] { border-color: #667eea; }
  details.dropdown[open] summary { color: #4338ca; }
  details.dropdown .content {
    padding: 12px;
    border-top: 2px solid #e5e7eb;
    background: #fff;
  }

  .btn { padding: 12px 16px; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 14px; cursor: pointer; color: #fff; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; }
  .btn-green { background: #10b981; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #ef4444; }
  .btn-orange { background: #f59e0b; }
  .btn-gray { background: #64748b; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; min-width: 100px; }
  .btn-filter { background: #fff; color: #374151; border: 2px solid #e5e7eb; padding: 8px 6px; font-size: 12px; flex: 1; min-width: 0; }
  .btn-filter:hover, .btn-filter.active { background: #eef2ff; border-color: #667eea; color: #4338ca; }

  input[type="text"], input[type="color"], select { width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; background: #fafafa; }
  input:focus, select:focus { outline: none; border-color: #667eea; background: #fff; }
  input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; border-radius: 4px; background: #e5e7eb; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #667eea; cursor: pointer; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .field { margin-bottom: 10px; }
  label { display: block; font-weight: 700; font-size: 12px; color: #374151; margin-bottom: 4px; }

  .footer { text-align: center; color: #fff; font-size: 12px; padding: 16px; margin-top: 16px; }
  .footer a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 8px; font-weight: 700; }
  .hint { background: #eef2ff; border-right: 4px solid #667eea; padding: 10px; border-radius: 8px; font-size: 12px; color: #4338ca; font-weight: 700; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>✨ ريشة — المحرر المتقدم</h1>
    <p>اسحب، أفلت، كبّر، دوّر، وامسح كما تشاء</p>
  </div>

  <div class="editor-wrap">
    <div class="card canvas-area">
      <canvas id="c" width="600" height="600"></canvas>
    </div>

    <div class="card tools">

      <div class="hint">💡 لتسحب النص أو الصورة، المس حدود العنصر (الإطار الأزرق) أو مقابض التحكم (الدوائر).</div>

      <details class="dropdown" open>
        <summary>✍️ النص</summary>
        <div class="content">
          <div class="field"><input type="text" id="textInput" placeholder="اكتب النص هنا..." value="اترك أثراً جميلاً"></div>
          <div class="btn-row"><button class="btn btn-primary" onclick="addText()">➕ إضافة نص</button></div>
        </div>
      </details>

      <details class="dropdown">
        <summary>🖼️ الصور (شعار أو خلفية)</summary>
        <div class="content">
          <div class="btn-row">
            <button class="btn btn-green" onclick="document.getElementById('imgLoader').click()">➕ إضافة صورة</button>
            <input type="file" id="imgLoader" accept="image/*" style="display:none;" onchange="addImage(event)">
          </div>
        </div>
      </details>

      <details class="dropdown">
        <summary>⬛ الأشكال</summary>
        <div class="content">
          <div class="btn-row" style="margin-bottom:10px;">
            <button class="btn btn-gray" onclick="addShape('rect')">▭ مستطيل</button>
            <button class="btn btn-gray" onclick="addShape('circle')">◯ دائرة</button>
          </div>
          <div class="btn-row" style="margin-bottom:10px;">
            <button class="btn btn-gray" onclick="addShape('triangle')">△ مثلث</button>
            <button class="btn btn-gray" onclick="addShape('line')">― خط</button>
          </div>
          <div class="field">
            <label>لون الشكل</label>
            <input type="color" id="shapeColor" value="#667eea">
          </div>
        </div>
      </details>

      <details class="dropdown">
        <summary>🎨 تعديل العنصر المحدد</summary>
        <div class="content">
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn btn-orange" onclick="bringForward()">⬆️ للأمام</button>
            <button class="btn btn-orange" onclick="sendBackward()">⬇️ للخلف</button>
          </div>
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn btn-purple" onclick="duplicateSelected()">📋 تكرار</button>
            <button class="btn btn-red" onclick="deleteSelected()">🗑️ حذف</button>
          </div>
          <div class="field">
            <label>💧 شفافية العنصر المحدد</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="changeOpacity(this.value)">
          </div>
          <div class="field">
            <label>🎨 لون النص المحدد</label>
            <input type="color" id="textColorPicker" value="#000000" oninput="changeTextColor(this.value)">
          </div>
        </div>
      </details>

      <details class="dropdown">
        <summary>✨ فلاتر الصورة</summary>
        <div class="content">
          <div class="btn-row" style="margin-bottom:6px;">
            <button class="btn-filter" onclick="applyFilter('none')">❌ بدون</button>
            <button class="btn-filter" onclick="applyFilter('bright')">🔆 إضاءة</button>
            <button class="btn-filter" onclick="applyFilter('contrast')">🌗 تباين</button>
          </div>
          <div class="btn-row" style="margin-bottom:6px;">
            <button class="btn-filter" onclick="applyFilter('saturate')">🎨 تشبع</button>
            <button class="btn-filter" onclick="applyFilter('grayscale')">⚫ رمادي</button>
            <button class="btn-filter" onclick="applyFilter('sepia')">🟤 قديم</button>
          </div>
          <div class="btn-row">
            <button class="btn-filter" onclick="applyFilter('blur')">💧 ضبابي</button>
            <button class="btn-filter" onclick="applyFilter('vintage')">📷 فينتاج</button>
            <button class="btn-filter" onclick="applyFilter('warm')">🌅 دافئ</button>
          </div>
        </div>
      </details>

      <details class="dropdown">
        <summary>🧽 الرسم والمسح</summary>
        <div class="content">
          <div class="btn-row" style="margin-bottom:8px;">
            <button class="btn btn-purple" onclick="toggleDraw()" id="drawBtn">✏️ تفعيل الرسم</button>
            <button class="btn btn-gray" onclick="clearAll()">🧹 مسح الكل</button>
          </div>
          <div class="field">
            <label>لون القلم/الممحاة</label>
            <input type="color" id="brushColor" value="#ffffff">
          </div>
          <div class="field">
            <label>حجم الفرشاة</label>
            <input type="range" id="brushSize" min="1" max="80" value="20">
          </div>
        </div>
      </details>

      <details class="dropdown" open>
        <summary>💾 التصدير</summary>
        <div class="content">
          <div class="btn-row">
            <button class="btn btn-primary" onclick="exportPNG()">💾 تحميل PNG</button>
          </div>
        </div>
      </details>

    </div>
  </div>

  <div class="footer">
    <a href="index.html">← العودة إلى ريشة</a>
  </div>
</div>

<script>
const canvas = new fabric.Canvas('c', {
  backgroundColor: '#ffffff',
  preserveObjectStacking: true,
  selection: true,
  allowTouchScrolling: false,
  enableRetinaScaling: true
});

fabric.Object.prototype.set({
  transparentCorners: false,
  cornerColor: '#667eea',
  cornerStrokeColor: '#fff',
  borderColor: '#667eea',
  cornerSize: 24,
  touchCornerSize: 30,
  padding: 5,
  cornerStyle: 'circle',
  borderScaleFactor: 2
});

function resizeCanvas() {
  const area = document.querySelector('.canvas-area');
  const maxWidth = area.clientWidth - 24;
  const scale = Math.min(1, maxWidth / 600);
  canvas.setDimensions({ width: 600 * scale, height: 600 * scale });
  canvas.setZoom(scale);
  canvas.renderAll();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
window.addEventListener('load', resizeCanvas);

function addText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { alert('اكتب نصاً أولاً'); return; }
  const t = new fabric.IText(text, {
    left: canvas.getWidth() / 2,
    top: canvas.getHeight() / 2,
    fontFamily: 'Cairo',
    fontSize: 40,
    fill: '#000000',
    direction: 'rtl',
    textAlign: 'center',
    originX: 'center',
    originY: 'center',
    padding: 10
  });
  canvas.add(t);
  canvas.setActiveObject(t);
  canvas.renderAll();
}

function addImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    fabric.Image.fromURL(ev.target.result, function(img) {
      const maxW = canvas.getWidth() * 0.6;
      if (img.width > maxW) img.scaleToWidth(maxW);
      img.set({
        left: canvas.getWidth() / 2,
        top: canvas.getHeight() / 2,
        originX: 'center',
        originY: 'center',
        padding: 10,
        filters: []
      });
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
    });
    e.target.value = '';
  };
  reader.readAsDataURL(file);
}

function addShape(type) {
  const color = document.getElementById('shapeColor').value;
  let shape;
  const center = { left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center', fill: color, padding: 10 };
  
  if (type === 'rect') {
    shape = new fabric.Rect({ ...center, width: 200, height: 150 });
  } else if (type === 'circle') {
    shape = new fabric.Circle({ ...center, radius: 100 });
  } else if (type === 'triangle') {
    shape = new fabric.Triangle({ ...center, width: 200, height: 180 });
  } else if (type === 'line') {
    shape = new fabric.Line([100, 0, 500, 0], { left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, stroke: color, strokeWidth: 8, originX: 'center', originY: 'center', padding: 10 });
  }
  
  canvas.add(shape);
  canvas.setActiveObject(shape);
  canvas.renderAll();
}

function bringForward() {
  const obj = canvas.getActiveObject();
  if (!obj) { alert('اختر عنصراً أولاً'); return; }
  canvas.bringForward(obj);
  canvas.renderAll();
}

function sendBackward() {
  const obj = canvas.getActiveObject();
  if (!obj) { alert('اختر عنصراً أولاً'); return; }
  canvas.sendBackwards(obj);
  canvas.renderAll();
}

function duplicateSelected() {
  const obj = canvas.getActiveObject();
  if (!obj) { alert('اختر عنصراً أولاً'); return; }
  obj.clone(function(cloned) {
    cloned.set({ left: cloned.left + 20, top: cloned.top + 20 });
    canvas.add(cloned);
    canvas.setActiveObject(cloned);
    canvas.renderAll();
  });
}

function deleteSelected() {
  const objs = canvas.getActiveObjects();
  if (objs.length === 0) { alert('اختر عنصراً أولاً'); return; }
  objs.forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  canvas.renderAll();
}

function changeOpacity(val) {
  const obj = canvas.getActiveObject();
  if (obj) {
    obj.set('opacity', val / 100);
    canvas.renderAll();
  }
}

function changeTextColor(color) {
  const obj = canvas.getActiveObject();
  if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
    obj.set('fill', color);
    canvas.renderAll();
  }
}

canvas.on('selection:created', updateControls);
canvas.on('selection:updated', updateControls);

function updateControls() {
  const obj = canvas.getActiveObject();
  if (!obj) return;
  document.getElementById('opacitySlider').value = (obj.opacity || 1) * 100;
  if (obj.fill && typeof obj.fill === 'string' && obj.fill.startsWith('#')) {
    document.getElementById('textColorPicker').value = obj.fill;
  }
}

function applyFilter(type) {
  const obj = canvas.getActiveObject();
  if (!obj || obj.type !== 'image') {
    alert('اختر صورة أولاً لتطبيق الفلتر');
    return;
  }
  
  obj.filters = [];
  
  if (type === 'bright') obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.3 }));
  else if (type === 'contrast') obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.3 }));
  else if (type === 'saturate') obj.filters.push(new fabric.Image.filters.Saturation({ saturation: 0.5 }));
  else if (type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
  else if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
  else if (type === 'blur') obj.filters.push(new fabric.Image.filters.Blur({ blur: 0.3 }));
  else if (type === 'vintage') {
    obj.filters.push(new fabric.Image.filters.Sepia());
    obj.filters.push(new fabric.Image.filters.Contrast({ contrast: 0.2 }));
  }
  else if (type === 'warm') {
    obj.filters.push(new fabric.Image.filters.BlendColor({ color: '#ff9900', mode: 'tint', alpha: 0.2 }));
    obj.filters.push(new fabric.Image.filters.Brightness({ brightness: 0.1 }));
  }
  
  obj.applyFilters();
  canvas.renderAll();
}

let isDrawing = false;

function toggleDraw() {
  isDrawing = !isDrawing;
  const btn = document.getElementById('drawBtn');
  if (isDrawing) {
    canvas.isDrawingMode = true;
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
    canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value);
    btn.innerHTML = '🛑 إيقاف الرسم';
    btn.classList.remove('btn-purple');
    btn.classList.add('btn-red');
    canvas.discardActiveObject();
    canvas.renderAll();
  } else {
    canvas.isDrawingMode = false;
    btn.innerHTML = '✏️ تفعيل الرسم';
    btn.classList.remove('btn-red');
    btn.classList.add('btn-purple');
  }
}

document.getElementById('brushColor').addEventListener('input', (e) => {
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = e.target.value;
});
document.getElementById('brushSize').addEventListener('input', (e) => {
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(e.target.value);
});

function clearAll() {
  if (!confirm('هل تريد مسح كل شيء؟')) return;
  canvas.clear();
  canvas.backgroundColor = '#ffffff';
  canvas.renderAll();
}

function exportPNG() {
  canvas.discardActiveObject();
  canvas.renderAll();
  const dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
  const link = document.createElement('a');
  link.download = `resha-editor-${Date.now()}.png`;
  link.href = dataURL;
  link.click();
}

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && canvas.getActiveObject()) {
    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      deleteSelected();
    }
  }
});

canvas.on('mouse:down', function(opt) {
  if (opt.e.touches && opt.e.touches.length === 1) {
    const touch = opt.e.touches[0];
    opt.e.clientX = touch.clientX;
    opt.e.clientY = touch.clientY;
  }
});
</script>

</body>
</html>
