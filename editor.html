<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ ريشة — المحرر المتقدم</title>

<!-- مكتبة Fabric.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<!-- خط Cairo -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 12px;
    margin: 0;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; margin: 0 0 4px; }
  .header p { font-size: 13px; opacity: 0.9; margin: 0; }

  .editor-wrap {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 1024px) {
    .editor-wrap {
      grid-template-columns: 1.6fr 1fr;
    }
    .canvas-area { position: sticky; top: 16px; }
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }

  .canvas-area {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1f5f9;
    border-radius: 16px;
    padding: 12px;
    overflow: hidden;
  }
  #c {
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    max-width: 100%;
    touch-action: none; /* مهم للسحب بالصبع */
  }

  .tools { display: flex; flex-direction: column; gap: 12px; }

  .section-title {
    font-size: 13px;
    font-weight: 800;
    color: #4338ca;
    margin-bottom: 6px;
    border-bottom: 2px solid #eef2ff;
    padding-bottom: 6px;
  }

  .btn {
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    color: #fff;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; }
  .btn-green { background: #10b981; }
  .btn-purple { background: #8b5cf6; }
  .btn-red { background: #ef4444; }
  .btn-orange { background: #f59e0b; }
  .btn-gray { background: #64748b; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; min-width: 100px; }

  input[type="text"], input[type="color"], select {
    width: 100%;
    padding: 10px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    background: #fafafa;
  }
  input:focus, select:focus { outline: none; border-color: #667eea; background: #fff; }

  .field { margin-bottom: 10px; }
  label {
    display: block;
    font-weight: 700;
    font-size: 12px;
    color: #374151;
    margin-bottom: 4px;
  }

  .footer {
    text-align: center;
    color: #fff;
    font-size: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  .footer a {
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>✨ ريشة — المحرر المتقدم</h1>
    <p>اسحب، أفلت، كبّر، دوّر، وامسح كما تشاء</p>
  </div>

  <div class="editor-wrap">
    <!-- الكانفاس -->
    <div class="card canvas-area">
      <canvas id="c" width="600" height="600"></canvas>
    </div>

    <!-- الأدوات -->
    <div class="card tools">
      
      <!-- إضافة نص -->
      <div>
        <div class="section-title">✍️ النص</div>
        <div class="field">
          <input type="text" id="textInput" placeholder="اكتب النص هنا..." value="اترك أثراً جميلاً">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="addText()">➕ إضافة نص</button>
        </div>
      </div>

      <!-- إضافة صورة -->
      <div>
        <div class="section-title">🖼️ الصور (شعار أو خلفية)</div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="document.getElementById('imgLoader').click()">➕ إضافة صورة</button>
          <input type="file" id="imgLoader" accept="image/*" style="display:none;" onchange="addImage(event)">
        </div>
      </div>

      <!-- أدوات العنصر المحدد -->
      <div>
        <div class="section-title">🎨 تعديل العنصر المحدد</div>
        <div class="btn-row" style="margin-bottom:8px;">
          <button class="btn btn-orange" onclick="bringForward()">⬆️ للأمام</button>
          <button class="btn btn-orange" onclick="sendBackward()">⬇️ للخلف</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-red" onclick="deleteSelected()">🗑️ حذف العنصر</button>
        </div>
      </div>

      <!-- أدوات الرسم (ممحاة) -->
      <div>
        <div class="section-title">🧽 الرسم والمسح</div>
        <div class="btn-row" style="margin-bottom:8px;">
          <button class="btn btn-purple" onclick="toggleDraw()" id="drawBtn">✏️ تفعيل الرسم</button>
          <button class="btn btn-gray" onclick="clearAll()">🧹 مسح الكل</button>
        </div>
        <div class="field">
          <label>لون القلم/الممحاة</label>
          <input type="color" id="brushColor" value="#ffffff">
        </div>
        <div class="field">
          <label>حجم الفرشاة</label>
          <input type="range" id="brushSize" min="1" max="50" value="15">
        </div>
      </div>

      <!-- التصدير -->
      <div>
        <div class="section-title">💾 التصدير</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="exportPNG()">💾 تحميل PNG</button>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <a href="index.html">← العودة إلى ريشة</a>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// تهيئة محرر Fabric.js
// ═══════════════════════════════════════
const canvas = new fabric.Canvas('c', {
  backgroundColor: '#ffffff',
  preserveObjectStacking: true, // للحفاظ على ترتيب الطبقات
  selection: true
});

// جعل الكانفاس متجاوباً مع عرض الشاشة
function resizeCanvas() {
  const area = document.querySelector('.canvas-area');
  const maxWidth = area.clientWidth - 24;
  const scale = maxWidth / canvas.getWidth();
  if (scale < 1) {
    canvas.setZoom(scale);
    canvas.setWidth(canvas.getWidth() * scale);
    canvas.setHeight(canvas.getHeight() * scale);
  } else {
    canvas.setZoom(1);
    canvas.setWidth(600);
    canvas.setHeight(600);
  }
  canvas.renderAll();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);

// ═══════════════════════════════════════
// إضافة النصوص
// ═══════════════════════════════════════
function addText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { alert('اكتب نصاً أولاً'); return; }

  const t = new fabric.IText(text, {
    left: canvas.getWidth() / 4,
    top: canvas.getHeight() / 4,
    fontFamily: 'Cairo',
    fontSize: 40,
    fill: '#000000',
    direction: 'rtl',
    textAlign: 'center',
    originX: 'center',
    originY: 'center'
  });
  canvas.add(t);
  canvas.setActiveObject(t);
  canvas.renderAll();
}

// ═══════════════════════════════════════
// إضافة الصور
// ═══════════════════════════════════════
function addImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    fabric.Image.fromURL(ev.target.result, function(img) {
      // تصغير الصورة إذا كانت كبيرة
      const maxW = canvas.getWidth() / 2;
      if (img.width > maxW) {
        img.scaleToWidth(maxW);
      }
      img.set({
        left: canvas.getWidth() / 2,
        top: canvas.getHeight() / 2,
        originX: 'center',
        originY: 'center'
      });
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
    });
    e.target.value = ''; // إعادة تصفير المدخل
  };
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════
// ترتيب الطبقات
// ═══════════════════════════════════════
function bringForward() {
  const obj = canvas.getActiveObject();
  if (!obj) { alert('اختر عنصراً أولاً'); return; }
  canvas.bringForward(obj);
  canvas.renderAll();
}

function sendBackward() {
  const obj = canvas.getActiveObject();
  if (!obj) { alert('اختر عنصراً أولاً'); return; }
  canvas.sendBackwards(obj);
  canvas.renderAll();
}

// ═══════════════════════════════════════
// حذف العنصر المحدد
// ═══════════════════════════════════════
function deleteSelected() {
  const objs = canvas.getActiveObjects();
  if (objs.length === 0) { alert('اختر عنصراً أولاً'); return; }
  objs.forEach(o => canvas.remove(o));
  canvas.discardActiveObject();
  canvas.renderAll();
}

// ═══════════════════════════════════════
// الرسم والمسح (Free Drawing)
// ═══════════════════════════════════════
let isDrawing = false;

function toggleDraw() {
  isDrawing = !isDrawing;
  const btn = document.getElementById('drawBtn');
  if (isDrawing) {
    canvas.isDrawingMode = true;
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color = document.getElementById('brushColor').value;
    canvas.freeDrawingBrush.width = parseInt(document.getElementById('brushSize').value);
    btn.innerHTML = '🛑 إيقاف الرسم';
    btn.classList.remove('btn-purple');
    btn.classList.add('btn-red');
  } else {
    canvas.isDrawingMode = false;
    btn.innerHTML = '✏️ تفعيل الرسم';
    btn.classList.remove('btn-red');
    btn.classList.add('btn-purple');
  }
}

document.getElementById('brushColor').addEventListener('input', (e) => {
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = e.target.value;
});
document.getElementById('brushSize').addEventListener('input', (e) => {
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(e.target.value);
});

// ═══════════════════════════════════════
// مسح الكل
// ═══════════════════════════════════════
function clearAll() {
  if (!confirm('هل تريد مسح كل شيء؟')) return;
  canvas.clear();
  canvas.backgroundColor = '#ffffff';
  canvas.renderAll();
}

// ═══════════════════════════════════════
// التصدير
// ═══════════════════════════════════════
function exportPNG() {
  // إلغاء تحديد أي عنصر قبل التصدير
  canvas.discardActiveObject();
  canvas.renderAll();
  
  const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
  const link = document.createElement('a');
  link.download = `resha-editor-${Date.now()}.png`;
  link.href = dataURL;
  link.click();
}

// ═══════════════════════════════════════
// اختصارات لوحة المفاتيح (للكمبيوتر)
// ═══════════════════════════════════════
document.addEventListener('keydown', (e) => {
  // Delete أو Backspace لحذف العنصر المحدد
  if ((e.key === 'Delete' || e.key === 'Backspace') && canvas.getActiveObject()) {
    // فقط إذا لم يكن المستخدم يكتب في حقل نصي
    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      deleteSelected();
    }
  }
});
</script>

</body>
</html>
