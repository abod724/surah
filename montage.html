<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 المونتاج — قريباً | ريشة</title>
<script data-goatcounter="https://resha.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }
  
  /* ═══ خلفية متحركة ═══ */
  body::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: floatBg 30s linear infinite;
    pointer-events: none;
  }
  
  @keyframes floatBg {
    from { transform: translate(0, 0); }
    to { transform: translate(50px, 50px); }
  }
  
  /* ═══ Container ═══ */
  .container {
    position: relative;
    z-index: 10;
    max-width: 500px;
    width: 100%;
    text-align: center;
    animation: fadeInUp 0.8s ease-out;
  }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  /* ═══ Icon ═══ */
  .icon-wrapper {
    width: 140px;
    height: 140px;
    margin: 0 auto 30px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    position: relative;
    animation: pulse 2s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { 
      transform: scale(1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }
    50% { 
      transform: scale(1.05);
      box-shadow: 0 25px 80px rgba(139, 92, 246, 0.4);
    }
  }
  
  .icon-wrapper::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 42px;
    background: linear-gradient(135deg, #a78bfa, #ec4899, #f59e0b);
    z-index: -1;
    opacity: 0.5;
    filter: blur(15px);
    animation: glow 3s ease-in-out infinite;
  }
  
  @keyframes glow {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
  
  .icon {
    font-size: 70px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  }
  
  /* ═══ Title ═══ */
  .title {
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: -1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  
  .subtitle {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 30px;
  }
  
  /* ═══ Message Card ═══ */
  .message-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    margin-bottom: 24px;
  }
  
  .message-text {
    font-size: 17px;
    line-height: 1.8;
    color: #fff;
    font-weight: 600;
    margin-bottom: 16px;
  }
  
  .message-text strong {
    color: #fbbf24;
    font-weight: 900;
  }
  
  /* ═══ Dots Animation ═══ */
  .dots {
    display: inline-flex;
    gap: 6px;
    margin-top: 10px;
  }
  
  .dot {
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40% { transform: scale(1.2); opacity: 1; }
  }
  
  /* ═══ Progress Bar ═══ */
  .progress-container {
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
  }
  
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #ec4899);
    border-radius: 50px;
    width: 65%;
    animation: progress 3s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
  }
  
  @keyframes progress {
    0%, 100% { width: 60%; }
    50% { width: 75%; }
  }
  
  /* ═══ Button ═══ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 40px;
    background: #fff;
    color: #6366f1;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 900;
    text-decoration: none;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  
  .btn:active {
    transform: scale(0.97);
  }
  
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
  }
  
  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
    transition: left 0.5s;
  }
  
  .btn:hover::before {
    left: 100%;
  }
  
  /* ═══ Footer ═══ */
  .footer {
    margin-top: 30px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    font-weight: 600;
  }
  
  .footer-brand {
    color: #fff;
    font-weight: 900;
    font-size: 15px;
  }
  
  /* ═══ Social Icons ═══ */
  .social {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }
  
  .social-icon {
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    transition: all 0.3s;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  
  .social-icon:active {
    transform: scale(0.95);
  }
  
  .social-icon:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-3px);
  }
  
  /* ═══ Responsive ═══ */
  @media (max-width: 500px) {
    .icon-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 32px;
    }
    .icon { font-size: 60px; }
    .title { font-size: 34px; }
    .subtitle { font-size: 17px; }
    .message-text { font-size: 15px; }
    .btn { padding: 14px 32px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- Icon -->
  <div class="icon-wrapper">
    <div class="icon">🎬</div>
  </div>
  
  <!-- Title -->
  <h1 class="title">قريباً</h1>
  <p class="subtitle">قسم المونتاج</p>
  
  <!-- Message Card -->
  <div class="message-card">
    <p class="message-text">
      نعمل حالياً على تطوير
      <br>
      <strong>قسم المونتاج الاحترافي</strong>
    </p>
    <p class="message-text" style="font-size: 15px; opacity: 0.9;">
      حوّل صورك إلى فيديو احترافي
      <br>
      بانتقالات وموسيقى وتأثيرات
    </p>
    
    <!-- Dots -->
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>
  
  <!-- Back Button -->
  <a href="index.html" class="btn">
    <span>←</span>
    <span>العودة إلى ريشة</span>
  </a>
  
  <!-- Footer -->
  <div class="footer">
    <div class="footer-brand">✨ ريشة</div>
    <div>استوديو الصور والفيديوهات</div>
  </div>
  
</div>

</body>
</html>
